<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The e2e browser's fontconfig (playwright.config.ts passes this file to it as FONTCONFIG_FILE; docs/adr/0058).
  Chromium on Linux asks fontconfig how to rasterize text, the brand's self-hosted web faces included, so the host's
  settings (hinting, its style, subpixel order, LCD filter, antialiasing) would move the pixels the brand journey
  compares with its baselines. This file takes the host's configuration, for its font directories and families,
  and then assigns one set of rendering properties to every request and every match, after anything the host sets:
  grayscale antialiasing, no hinting, no subpixel rendering. The text the baselines hold is drawn only in the brand's
  web faces (the journey's computed checks name them), so the host's installed fonts do not enter them either.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
