name: supply-chain

# The dependency and image hygiene gates of PRD sections 16 and 18 that ci.yml (the plan's verbatim
# workflow) does not carry: on every pull request, both container images are built from their
# Dockerfiles and scanned, failing on any HIGH or CRITICAL finding that has a fix, and every
# production dependency's license is checked against tools/check-licenses/allowlist.json.
# docs/adr/0010-supply-chain-gates-beside-ci.md records why these live here.
on: [pull_request]

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          push: false
          tags: tp-${{ matrix.app }}:scan

      - name: Scan the ${{ matrix.app }} image (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tp-${{ matrix.app }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
