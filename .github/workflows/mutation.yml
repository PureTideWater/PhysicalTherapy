name: mutation

# Mutation testing on the money paths (PRD section 18; docs/adr/0066, Part 4; docs/runbooks/ci.md, "Mutation
# testing"): the money package, the pricing engine, the ledger, and the packet verifier and arithmetic, each scored by
# Stryker's vitest runner in the shards of stryker/shards.json. The `mutation` job is the required check: it merges the
# shards' reports by package and fails a package at or below 85%, any survivor not recorded as equivalent
# (tools/stryker/equivalent/<package>.json), any error but a test file's load failure, and any shard whose canary was
# not 5 of 5 as expected (tools/stryker/gate.ts).
#
# What runs: every package on a push to the build branch, weekly and on request; on a pull request, every shard of each
# package whose closure the change touches (tools/stryker/affected.ts: its code and tests and what they import,
# upstream workspace packages included, its data files, and the third-party packages and test tooling the lockfile
# resolves for it), and nothing when it touches none, so a pull request that changes no money path passes in about a
# minute. A workflow of its own, beside ci.yml's `all green`, so that gate stays fast on money pull requests; its own
# concurrency group, so the two never cancel each other. Synthetic data only, no credentials, read-only token.
#
# Every job runs the one exact Node tools/stryker/unicode.json names: the recorded equivalents that rest on the engine's
# Unicode data were checked over every code point on it, and the gate fails them on a shard that ran on other data.
on:
  push:
    branches: [claude/build-platform]
  pull_request:
  schedule:
    # Weekly, every package. Schedules fire only from the default branch, so this one runs once it carries the
    # workflow.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push supersedes its older run; every push, weekly and dispatched run is kept, grouped by its
# commit. Named for this workflow, so no other workflow's run shares the group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which packages to measure, and so which shards (every shard of each affected package: a package's shards run all
  # or none). A pull request is diffed from its merge base with the base branch.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      any: ${{ steps.affected.outputs.any }}
      packages: ${{ steps.affected.outputs.packages }}
      shards: ${{ steps.affected.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What the change affects
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm -s exec tsx tools/stryker/affected.ts --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  # One job per shard: the canary first, which proves this job's runner before any of its mutants, then the shard's
  # packages in full. Skipped when nothing is affected (an empty matrix is an error).
  stryker:
    name: stryker (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    env:
      TP_MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The canary
        run: |
          pnpm stryker run tools/stryker/canary/stryker.config.mjs
          pnpm -s exec tsx tools/stryker/canary/verdict.ts --shard "$TP_MUTATION_SHARD"
      - name: The shard
        run: pnpm -s exec tsx tools/stryker/shards.ts "$TP_MUTATION_SHARD"
      - name: The shard's scores and survivors
        if: ${{ !cancelled() }}
        run: pnpm -s exec tsx tools/stryker/gate.ts reports/mutation --shard "$TP_MUTATION_SHARD"
      # The reports, its canary verdict among them, for the gate; overwritten when the job is re-run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutation-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  # The required check. It runs whatever the jobs above did, and fails on a failed or cancelled job, on a skipped shard
  # job when a package was affected, on outputs of the changes job other than the ones it writes (fail closed), and on
  # any gate rule; it passes with "no money path changed" when none was.
  mutation:
    name: mutation
    needs: [changes, stryker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The jobs it needs
        id: needs
        env:
          CHANGES: ${{ needs.changes.result }}
          STRYKER: ${{ needs.stryker.result }}
          ANY: ${{ needs.changes.outputs.any }}
          PACKAGES: ${{ needs.changes.outputs.packages }}
          SHARDS: ${{ needs.changes.outputs.shards }}
        run: |
          echo "changes: $CHANGES; stryker: $STRYKER; any: ${ANY:-(none)}; packages: ${PACKAGES:-(none)}; shards: ${SHARDS:-(none)}"
          if [ "$CHANGES" != success ]; then
            echo "::error::The changes job ended $CHANGES, so what this change affects is unknown."
            exit 1
          fi
          # The outputs exactly as tools/stryker/affected.ts writes them; anything else (none, or garbled) fails closed.
          case "$ANY" in
            true | false) ;;
            *)
              echo "::error::The changes job gave no verdict (any=${ANY:-(none)}), so what this change affects is unknown."
              exit 1
              ;;
          esac
          NAMES='^\[("[a-z]+(-[a-z]+)*"(,"[a-z]+(-[a-z]+)*")*)?\]$'
          if ! printf '%s' "$SHARDS" | grep -Eq "$NAMES" || ! printf '%s' "$PACKAGES" | grep -Eq "$NAMES"; then
            echo "::error::The changes job gave shards=${SHARDS:-(none)} and packages=${PACKAGES:-(none)}, not JSON arrays of names."
            exit 1
          fi
          if [ "$ANY" = false ]; then
            if [ "$SHARDS" != '[]' ] || [ "$PACKAGES" != '[]' ]; then
              echo "::error::The changes job said no package is affected, yet gave shards=$SHARDS and packages=$PACKAGES."
              exit 1
            fi
            if [ "$STRYKER" != skipped ]; then
              echo "::error::No package was affected, yet the shard jobs ended $STRYKER."
              exit 1
            fi
            echo "No money path changed: no mutation run." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SHARDS" = '[]' ] || [ "$PACKAGES" = '[]' ]; then
            echo "::error::The changes job said a package is affected, yet gave shards=$SHARDS and packages=$PACKAGES."
            exit 1
          fi
          if [ "$STRYKER" != success ]; then
            echo "::error::A shard job ended $STRYKER (skipped, failed or cancelled), so the affected packages are not scored."
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.needs.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.needs.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.needs.outputs.run == 'true'
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.needs.outputs.run == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.needs.outputs.run == 'true'
        with:
          pattern: mutation-*
          path: reports/mutation
          merge-multiple: true
      - name: The gate
        if: steps.needs.outputs.run == 'true'
        env:
          SHARDS: ${{ needs.changes.outputs.shards }}
        run: pnpm -s exec tsx tools/stryker/gate.ts reports/mutation --expected "$SHARDS" --summary "$GITHUB_STEP_SUMMARY"
