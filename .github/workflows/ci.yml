name: ci
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: pip install pyx12
      - run: pnpm audit --prod
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck && pnpm lint && pnpm lint:logs
      - run: pnpm verify-content
      - run: tools/check-releases-immutable.sh "origin/${{ github.base_ref }}"
      - run: pnpm synth --all
      - run: pnpm test && pnpm test:golden && pnpm test:oracle
      - run: pnpm db:migrate && pnpm test:db
        env: { DATABASE_URL: postgres://postgres:test@localhost:5432/postgres }
      - run: pnpm test:e2e
        env: { DATABASE_URL: postgres://postgres:test@localhost:5432/postgres }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            brand-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm build
      - run: pnpm cdk:diff
  mutation:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'money')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stryker run
