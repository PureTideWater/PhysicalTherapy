packages:
  - apps/*
  - packages/*
  - infra
  - tools
  # The mutation canary's workspace package (its case 3, tools/stryker/canary/expected.json), which a tools test
  # imports by name.
  - tools/stryker/canary/lib

# One version of each shared tool across the workspace; packages refer to these as "catalog:".
catalog:
  "@types/node": ^24.19.2
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitest/coverage-v8": ^5.0.5
  decimal.js: ^10.6.0
  drizzle-orm: ^0.45.3
  fast-check: ^4.10.2
  pg: ^8.23.1
  react: ^19.3.1
  react-dom: ^19.3.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.5
  zod: ^4.6.7

# pnpm 10 runs no dependency lifecycle scripts unless they are listed here.
onlyBuiltDependencies:
  - esbuild

# Supply-chain gates (the founder's F2 (b), 2026-10-25; ADR 0066 Part 2; designs/lane-b-ci.md §3.2.1).
# A version resolves only once it has been published for three days (4,320 minutes). A young security fix enters
# only by an exact-version exclude ("name@x.y.z") that tools/check-toolchain/release-age-exceptions.json also holds,
# with its advisory and an expiry; check-toolchain holds the two lists equal and refuses any other form.
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []
# A version fails when an earlier version of the same package was published with stronger evidence (a trusted
# publisher, then provenance). Each exclude is one fixed old version, also listed with its reason in
# tools/check-toolchain/trust-exceptions.json: semver 6.3.1 (2023, no provenance) follows 7.5.1 (with provenance) and
# is reached through @babel/core (the co-founder's CQ2 (a), 2026-10-26).
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
