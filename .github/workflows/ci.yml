name: ci

# Every gate of PRD 18 on every pull request and on every push to the build branch, as parallel jobs behind one gate,
# `all green`, which needs them all and is the one check of this workflow the ruleset requires (docs/adr/0066, Part 1;
# docs/runbooks/ci.md). A push run re-verifies each merge on its merged tree and seeds the build branch's caches, which
# every pull request into it can restore; a pull request's own run writes caches only to its own scope, which no other
# branch reads. No path filter: every job runs on every event, so the gate always reports.
on:
  pull_request:
  push:
    branches: [claude/build-platform]

# The jobs read the repository and nothing else: no step calls the GitHub API (docs/adr/0063).
permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push run is never cancelled. The group starts with the
# workflow's own name, because groups are shared across the repository's workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub's bash with pipefail (bash --noprofile --norc -eo pipefail), so a failing command inside a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  # The fast checks, each run whatever the one before it did once the install succeeded, so one red step shows every
  # other verdict too.
  static:
    # Pinned, as every job is: ubuntu-latest moves to Ubuntu 26.04 in November 2026 (runner-images #14748), and a job
    # moves only with a commit that names its new image, as this one did with the Playwright that supports it (audit
    # item #19; docs/adr/0066, Part 3).
    runs-on: ubuntu-26.04
    # About 3 minutes; a hung step stops at 15 instead of GitHub's 360 (docs/adr/0063).
    timeout-minutes: 15
    steps:
      # The whole history: the secret scan, the release check and the engine freeze read the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      # pyx12, the 835 oracle test:oracle compares the parser with.
      - run: pip install pyx12
      - id: install
        run: pnpm install --frozen-lockfile
      # What this run checks: a pull request's commits beyond its base branch, or a push's commits beyond the branch's
      # previous head (github.event.before, which for a merge commit is its first parent), or the commit alone when the
      # branch is new. A previous head the checkout does not hold (a force push, which the ruleset "Protect the build
      # branch" blocks, governance runbook step 4A) fails here rather than check fewer commits.
      - name: The commits this run checks
        id: range
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            echo "::error title=The commits this run checks::$base is not a commit in this checkout, so the range $base..HEAD cannot be checked."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "This run checks the commits $base..HEAD." | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm audit --prod
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Every dependency, development tooling included, at high or worse (PRD 16; docs/runbooks/dependency-upgrades.md).
      - run: pnpm audit --audit-level=high
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Every action pinned to a full commit SHA with its version, one per action across the workflows; a pin new
      # against the base, or a step whose inputs changed, read from GitHub: the tag's commit, the inputs the action
      # declares, every action a composite nests pinned by SHA, and release.yml's nested caches turned off
      # (tools/check-action-pins; docs/adr/0066, Part 2).
      - name: Action pins
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.range.outcome == 'success' }}
        env: { BASE: "${{ steps.range.outputs.base }}" }
        run: pnpm actions:check
      # The pnpm packageManager names, without advisories and at least three days old; every version the lockfile adds
      # against the base at least three days old or a dated exclude; the exceptions' lists held to their records
      # (tools/check-toolchain; docs/adr/0066, Part 2).
      - name: Toolchain
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.range.outcome == 'success' }}
        env: { BASE: "${{ steps.range.outputs.base }}" }
        run: pnpm toolchain:check
      # The secret scan (docs/adr/0063): the pinned gitleaks the pre-push hook runs, its release archive checked against
      # the SHA-256 in tools/gitleaks/release.txt, over the commits above (each merge by what it adds beyond its
      # parents), with the repository's configuration. It needs no licence and calls no API, so it runs the same in an
      # organization's private repository.
      - name: Secret scan of the pull request's commits
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        env: { BASE: "${{ steps.range.outputs.base }}" }
        run: |
          gitleaks="$(tools/gitleaks/install.sh)"
          "$gitleaks" git --no-banner --redact --log-level info --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --log-opts "--no-color --no-ext-diff --no-textconv --diff-merges=remerge $BASE..HEAD" .
      # Every table, interchange and workbook in the commit, read before anything regenerates the tree, through the
      # writer's own fixture guard: SYNTHSENDER in an identifier column, or a pinned table (CO-03, docs/adr/0059).
      - run: pnpm check:fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm verify-content
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Published releases and prompt versions unchanged
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        env: { BASE: "${{ steps.range.outputs.base }}" }
        run: tools/check-releases-immutable.sh "$BASE"
      # The engine freeze (reconciliation-001's change order; docs/adr/0064): against the merge base, no non-test engine
      # file, file of the engine's package, existing golden file, synthetic release a golden claim pins or rule table
      # changes, but what tools/engine-freeze/exception.json lets through in the pull request it names (PR_NUMBER) and
      # that adds or edits it; the engine's diff stat goes to the job summary. A pull request's alone: the exception
      # names one, which a push does not carry. A merge's push follows its pull request's run, which this step gated;
      # a direct push is blocked by the ruleset "Protect the build branch" (governance runbook, step 4A), and the unit
      # job's differential test still prices the engines of the base and this commit on every event
      # (docs/runbooks/ci.md, "What a run checks").
      - name: Engine freeze
        if: ${{ github.event_name == 'pull_request' && !cancelled() && steps.install.outcome == 'success' }}
        env: { BASE_REF: "${{ github.base_ref }}", PR_NUMBER: "${{ github.event.pull_request.number }}" }
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          pnpm -s exec tsx tools/engine-freeze/check.ts "$base"
      - id: synth
        run: pnpm synth --all
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # The generation is deterministic, so a committed fixture it rewrites, or a file it removes from a case or EMR
      # directory, is a fixture the commit holds that packages/synth did not write: the run fails on it.
      - run: git diff --exit-code -- fixtures/synthetic && test -z "$(git status --porcelain -- fixtures/synthetic)"
        if: ${{ !cancelled() && steps.synth.outcome == 'success' }}
      # Every workspace's TypeScript (tools/typecheck/run.ts), incremental over the build information the last run on
      # this branch or its base left: tsc compares every input's hash, so a cache can only save time.
      - name: Restore the typecheck cache
        id: tsc-cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/tsc
          key: tsc-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            tsc-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            tsc-v1-${{ runner.os }}-
      - id: typecheck
        run: pnpm typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Save the typecheck cache
        if: ${{ !cancelled() && steps.typecheck.outcome != 'skipped' && steps.tsc-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/tsc
          key: ${{ steps.tsc-cache.outputs.cache-primary-key }}
      - run: pnpm lint:logs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm test:golden
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # The 10,000-claim PAR-29 remittance the oracle reads too, written deterministically into its ignored path and never
      # committed. In this job no unit test writes it first (fixtures.test.ts does, in unit), so the generation does.
      - run: pnpm synth --large
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm test:oracle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Every production dependency's licence against tools/check-licenses/allowlist.json (PRD 16; docs/adr/0010).
      - run: pnpm licenses:check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  # ESLint over every file in memory-bounded groups (tools/lint/run.ts): no warning passes.
  lint:
    runs-on: ubuntu-26.04
    # About 2 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit:
    runs-on: ubuntu-26.04
    # About 4 minutes.
    timeout-minutes: 20
    steps:
      # The whole history: the engine freeze's differential test extracts the base commit's engine with git archive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Playwright's own Chromium, the build the brand journey's pixel baselines were made with, and the one the
      # worker's tests print reports with: installed before any vitest run, which fails on CI without it rather than
      # skip a printing test (tools/test/ci-chromium.ts; docs/adr/0058). The browsers come from the cache when this
      # Playwright's builds of them (playwright-core's browsers.json) are there, so the install then fetches only the
      # system libraries; this job saves them on a miss, and the db and e2e jobs restore them.
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      # The runner image's name and version, from the runner's own environment (the env context holds only what a
      # workflow sets): the system packages' cache key.
      - name: The runner image
        id: runner-image
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error title=The runner image::the runner names no ImageOS or ImageVersion, so the system packages' cache has no key"
            exit 1
          fi
          echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # The .deb files Playwright's --with-deps fetched on an earlier run of this image and Playwright, or of an earlier
      # image version or Playwright by the restore keys; each is used only once its SHA-256 is the signed index's for its
      # exact version (tools/ci/apt-archives.sh; docs/adr/0066, Part 3).
      - name: Restore the browsers' system packages
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-v1-${{ steps.runner-image.outputs.key }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            apt-v1-${{ steps.runner-image.outputs.key }}-
            apt-v1-${{ steps.runner-image.outputs.os }}-
      - name: Check the restored system packages against the signed index
        run: tools/ci/apt-archives.sh verify "$RUNNER_TEMP/apt-archives"
      - id: browser-install
        run: pnpm --filter @tp/web exec playwright install --with-deps chromium
      # Every file of the headless shell's and Chromium's builds against apps/web/e2e/browser.json, before any test runs
      # or any cache is saved: a Playwright upgrade is red here until ADR 0058's baseline procedure runs
      # (docs/runbooks/ci.md, "Upgrading the browser"), and the steps after it still run, so its other effects show.
      - name: Check the browser builds against browser.json
        run: node tools/ci/browser-build.ts
      - name: Save Playwright's browsers
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # The system packages, saved by this job alone, on a miss, and by the build branch's own runs only (a pull
      # request's cache is its own scope, which no other run reads): what apt kept of this install.
      - name: Collect the system packages apt downloaded
        if: ${{ github.event_name != 'pull_request' && steps.apt.outputs.cache-hit != 'true' }}
        run: tools/ci/apt-archives.sh collect "$RUNNER_TEMP/apt-archives"
      - name: Save the browsers' system packages
        if: ${{ github.event_name != 'pull_request' && steps.apt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt.outputs.cache-primary-key }}
      # The pinned gitleaks, its release archive checked against tools/gitleaks/release.txt, which the pre-push hook's
      # tests run for real (tools/hooks/pre-push.test.ts, which fails on CI without it rather than skip those cases).
      - name: The pinned gitleaks for the pre-push hook's tests
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: tools/gitleaks/install.sh
      # The base the differential test prices the golden claims and 20,000 generated claims against, with the base
      # engine and this one (tools/engine-freeze/differential.test.ts, which fails in CI without it): a pull request's
      # merge base, or a push's previous head (its first parent when the branch is new).
      - name: The engine freeze's base
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            echo "::error title=The engine freeze's base::$base is not a commit in this checkout, so the differential test has no base engine."
            exit 1
          fi
          echo "ENGINE_FREEZE_BASE=$base" >> "$GITHUB_ENV"
          echo "The differential test compares this commit's engine with $base's."
      - run: pnpm test
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}

  # The database suite in shards (vitest's --shard, by the SHA-1 of each file's path): every shard on its own Postgres,
  # migrated by itself, with Chromium; together they run every db file once, which each shard's list proves (CI-04).
  # Six shards on a private repository's 2-CPU runners, four on the public 4-CPU ones.
  db:
    name: db (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    # About 5 minutes each.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.repository.private && '[1,2,3,4,5,6]' || '[1,2,3,4]') }}
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # PostgreSQL from docker-compose.yml, the one digest-pinned image CI, the capacity harness and pnpm dev share,
      # started in the background so its pull overlaps the setup; the wait step reads compose's own verdict, healthy on
      # TCP (tools/ci/postgres.sh; docs/adr/0066, Part 2).
      - name: Start the database
        run: tools/ci/postgres.sh up
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      # The runner image's name and version, from the runner's own environment (the env context holds only what a
      # workflow sets): the system packages' cache key.
      - name: The runner image
        id: runner-image
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error title=The runner image::the runner names no ImageOS or ImageVersion, so the system packages' cache has no key"
            exit 1
          fi
          echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # The .deb files Playwright's --with-deps fetched on an earlier run of this image and Playwright, or of an earlier
      # image version or Playwright by the restore keys; each is used only once its SHA-256 is the signed index's for its
      # exact version (tools/ci/apt-archives.sh; docs/adr/0066, Part 3).
      - name: Restore the browsers' system packages
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-v1-${{ steps.runner-image.outputs.key }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            apt-v1-${{ steps.runner-image.outputs.key }}-
            apt-v1-${{ steps.runner-image.outputs.os }}-
      - name: Check the restored system packages against the signed index
        run: tools/ci/apt-archives.sh verify "$RUNNER_TEMP/apt-archives"
      - id: browser-install
        run: pnpm --filter @tp/web exec playwright install --with-deps chromium
      # Every file of the headless shell's and Chromium's builds against apps/web/e2e/browser.json, before any test runs
      # or any cache is saved: a Playwright upgrade is red here until ADR 0058's baseline procedure runs
      # (docs/runbooks/ci.md, "Upgrading the browser"), and the steps after it still run, so its other effects show.
      - name: Check the browser builds against browser.json
        run: node tools/ci/browser-build.ts
      - name: Wait for the database
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: tools/ci/postgres.sh wait
      # The database logs every deliberate refusal the tests provoke; its log, printed when the job fails, would bury
      # the failing test's own output unquieted. Only the database's log level changes.
      - name: Quiet the database's log
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: psql "$DATABASE_URL" -qc "ALTER SYSTEM SET log_min_messages = 'panic'" -qc "ALTER SYSTEM SET log_min_error_statement = 'panic'" -qc "SELECT pg_reload_conf()"
      # Each shard's own durations from its last run, so its slowest files start first; without them vitest orders
      # by file size. Shard membership is fixed by the paths alone, so this only orders.
      - name: Restore this shard's test durations
        id: vitest-cache
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/vitest
          key: vitest-db-v1-${{ runner.os }}-${{ strategy.job-total }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: vitest-db-v1-${{ runner.os }}-${{ strategy.job-total }}-${{ matrix.shard }}-
      - name: The database suite, this shard's files
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env: { SHARD: "${{ matrix.shard }}/${{ strategy.job-total }}" }
        run: pnpm db:migrate && pnpm test:db --shard="$SHARD" --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/db-results.json"
      # The files this shard ran, sorted, with their count and the list's SHA-256, in the log and the summary: the
      # union of every shard's list is the whole db project, each file once (docs/runbooks/ci.md, "Reading a red gate").
      - name: Files this shard ran
        if: ${{ !cancelled() }}
        env: { SHARD: "${{ matrix.shard }}/${{ strategy.job-total }}" }
        run: |
          results="$RUNNER_TEMP/db-results.json"
          if [ ! -s "$results" ]; then
            echo "::error title=Files this shard ran::vitest wrote no results, so db ($SHARD) cannot show which files it ran."
            exit 1
          fi
          jq -r '.testResults[].name' "$results" | sed "s|^$GITHUB_WORKSPACE/||" | LC_ALL=C sort > "$RUNNER_TEMP/db-files.txt"
          count="$(wc -l < "$RUNNER_TEMP/db-files.txt" | tr -d ' ')"
          sha="$(sha256sum "$RUNNER_TEMP/db-files.txt" | cut -d ' ' -f 1)"
          {
            echo "### Files db ($SHARD) ran: $count, list SHA-256 $sha"
            echo
            echo '```'
            cat "$RUNNER_TEMP/db-files.txt"
            echo '```'
            echo
            echo "The ten slowest, in seconds:"
            echo
            echo '```'
            jq -r '.testResults[] | [((.endTime - .startTime) / 1000 | floor), .name] | @tsv' "$results" | sed "s|$GITHUB_WORKSPACE/||" | LC_ALL=C sort -rn | sed -n '1,10p'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save this shard's test durations
        if: ${{ !cancelled() && steps.vitest-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/vitest
          key: ${{ steps.vitest-cache.outputs.cache-primary-key }}
      # Compose prints no container's log when the job ends, as a service container's was: the database's last lines,
      # past the quiet step's refusals, when anything failed.
      - name: The database's log
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres

  # The schema approval as its own check (CO-02, CLAUDE.md's command): the document regenerated from a freshly migrated
  # database must match docs/product/domain-model.md, every divergence explained, and carry the founder's approval of
  # exactly that text. A schema pull request awaiting the signature is red here alone.
  domain-model:
    name: domain model
    runs-on: ubuntu-26.04
    # About a minute.
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      # The whole history: the summary reads the base branch's document.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      # PostgreSQL from docker-compose.yml in the background, as in the db job (tools/ci/postgres.sh).
      - name: Start the database
        run: tools/ci/postgres.sh up
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Each approval of the domain model opens with what changed since the last approved one (docs/adr/0063): the
      # summary against the base branch, whose document is approved, in this job's summary and its log, written before
      # the check can fail. It reads no database.
      - name: Changes since the last approved domain model
        if: ${{ github.event_name == 'pull_request' }}
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          if git cat-file -e "origin/$BASE_REF:docs/product/domain-model.md" 2>/dev/null; then
            pnpm -s db:domain-model --summary-since "origin/$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "The base branch $BASE_REF holds no docs/product/domain-model.md; there is no approved document to compare with." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Wait for the database
        run: tools/ci/postgres.sh wait
      - run: pnpm db:migrate
      - run: pnpm db:domain-model --check --strict --require-approval
      # Compose prints no container's log when the job ends, as a service container's was: the database's last lines,
      # past the quiet step's refusals, when anything failed.
      - name: The database's log
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres

  # The production build of the web app and the worker, kept for the e2e shards (the web standalone tree, stamped with
  # this commit, which a shard refuses for any other), and the stacks' diff.
  build:
    runs-on: ubuntu-26.04
    # About 2.5 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm build
      # What scripts/start-standalone.sh serves (the standalone server with its symlinks, which tar keeps, and the
      # static assets; public/ comes with each shard's checkout of the same commit) and the commit it was built from.
      - name: Keep the web build for the e2e shards
        run: |
          git rev-parse HEAD > apps/web/.next/BUILD_COMMIT
          tar -C apps/web -cf - .next/standalone .next/static .next/BUILD_COMMIT | gzip -1 > "$RUNNER_TEMP/web-build.tar.gz"
      # Named per run, so a re-run of failed jobs replaces it rather than failing on the name the first attempt left.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - run: pnpm cdk:diff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  # The end-to-end journeys in shards over the build job's production build, each shard on its own Postgres, prepared
  # and seeded for it (apps/web/e2e/prepare.ts). Three shards on a private repository's 2-CPU runners, two otherwise.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: build
    runs-on: ubuntu-26.04
    # About 5 minutes each.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.repository.private && '[1,2,3]' || '[1,2]') }}
    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # PostgreSQL from docker-compose.yml in the background, as in the db job (tools/ci/postgres.sh).
      - name: Start the database
        run: tools/ci/postgres.sh up
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      # The runner image's name and version, from the runner's own environment (the env context holds only what a
      # workflow sets): the system packages' cache key.
      - name: The runner image
        id: runner-image
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error title=The runner image::the runner names no ImageOS or ImageVersion, so the system packages' cache has no key"
            exit 1
          fi
          echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # The .deb files Playwright's --with-deps fetched on an earlier run of this image and Playwright, or of an earlier
      # image version or Playwright by the restore keys; each is used only once its SHA-256 is the signed index's for its
      # exact version (tools/ci/apt-archives.sh; docs/adr/0066, Part 3).
      - name: Restore the browsers' system packages
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-v1-${{ steps.runner-image.outputs.key }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            apt-v1-${{ steps.runner-image.outputs.key }}-
            apt-v1-${{ steps.runner-image.outputs.os }}-
      - name: Check the restored system packages against the signed index
        run: tools/ci/apt-archives.sh verify "$RUNNER_TEMP/apt-archives"
      - id: browser-install
        run: pnpm --filter @tp/web exec playwright install --with-deps chromium
      # Every file of the headless shell's and Chromium's builds against apps/web/e2e/browser.json, before any test runs
      # or any cache is saved: a Playwright upgrade is red here until ADR 0058's baseline procedure runs
      # (docs/runbooks/ci.md, "Upgrading the browser"), and the steps after it still run, so its other effects show.
      - name: Check the browser builds against browser.json
        run: node tools/ci/browser-build.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build
      - run: tar -C apps/web -xzf "$RUNNER_TEMP/web-build/web-build.tar.gz"
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
      - name: Wait for the database
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: tools/ci/postgres.sh wait
      - name: Quiet the database's log
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: psql "$DATABASE_URL" -qc "ALTER SYSTEM SET log_min_messages = 'panic'" -qc "ALTER SYSTEM SET log_min_error_statement = 'panic'" -qc "SELECT pg_reload_conf()"
      # E2E_PREBUILT: the web server starts the downloaded build, after scripts/build-stamp.ts refuses one stamped with
      # any other commit, in place of building it again (apps/web/playwright.config.ts). A test that passes only on its
      # retry fails the run and is named (failOnFlakyTests).
      - name: The end-to-end journeys, this shard's
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env: { E2E_PREBUILT: "1", SHARD: "${{ matrix.shard }}/${{ strategy.job-total }}" }
        run: pnpm test:e2e --shard="$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            brand-screenshots/
          if-no-files-found: ignore
          # Up to about 54 MB a run over every shard, against GitHub Team's 2 GB of Actions storage (docs/adr/0063).
          retention-days: 7
          overwrite: true
      # A failed run's screenshot comparisons, readable from the job's log alone: each diff and actual picture under
      # apps/web/test-results smaller than 300 KB, as its SHA-256 and then lines "<path> <i>/<n> <8,000 base64
      # characters>", which a log reader that cuts long lines still gets whole (tools/ci/print-pictures.sh;
      # docs/adr/0058).
      - name: The failed comparisons' pictures
        if: failure()
        run: |
          if [ -d apps/web/test-results ]; then
            find apps/web/test-results -type f \( -name '*-diff.png' -o -name '*-actual.png' \) -size -300k | LC_ALL=C sort | tools/ci/print-pictures.sh
          fi
      # The brand baselines regenerated from nothing on this runner, on every pull request and every push, with no path
      # condition: the pictures are drawn by application code (the header, the worker's report covers) as well as by the
      # browser and the runner image, and the journey's comparisons pass a change under their tolerance, so only bytes
      # prove that CI renders the committed baselines (docs/adr/0058; docs/adr/0066, Part 3). The run writes every
      # baseline into an empty directory outside the repository (E2E_BASELINES_DIR, playwright.config.ts), laid out as
      # the repository is, so each is written from nothing while the tracked tree stays clean, as E2E_PREBUILT's build
      # stamp requires; one attempt (the config retries once on CI), with its own output directory and reporter, so the
      # journeys' results above stay as they were. The pictures written are the ones present after the run, so no
      # message text of Playwright's is read. It fails on a failed run, on any set of pictures written other than the
      # committed set, or on any byte, and prints each differing or extra picture's SHA-256, then the picture as lines
      # "<path> <i>/<n> <8,000 base64 characters>", under its repository path, so a log reader that cuts long lines still
      # gets it whole and proves each decode by its SHA-256 (tools/ci/print-pictures.sh; docs/runbooks/ci.md, "Upgrading
      # the browser").
      - name: The brand baselines, regenerated from nothing
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' && matrix.shard == 1 }}
        env: { E2E_PREBUILT: "1" }
        run: |
          committed=apps/web/e2e/brand.spec.ts-snapshots
          fresh="$RUNNER_TEMP/baselines"
          printer="$PWD/tools/ci/print-pictures.sh"
          rm -rf "$fresh"
          mkdir -p "$fresh/apps/web/e2e"
          git ls-files -- "$committed" | LC_ALL=C sort > "$RUNNER_TEMP/baselines-committed"
          status=0
          E2E_BASELINES_DIR="$fresh/apps/web/e2e" pnpm --filter @tp/web exec playwright test e2e/brand.spec.ts --update-snapshots=all --retries=0 --reporter=list --output="$RUNNER_TEMP/baselines-results" 2>&1 || status=$?
          : > "$RUNNER_TEMP/baselines-written"
          if [ -d "$fresh/$committed" ]; then
            (cd "$fresh" && find "$committed" -type f -name '*-chromium-linux.png' | LC_ALL=C sort) > "$RUNNER_TEMP/baselines-written"
          fi
          failed=0
          if [ "$status" -ne 0 ]; then
            echo "::error title=The brand baselines::the brand journey exited $status while regenerating its baselines"
            failed=1
          fi
          if ! cmp -s "$RUNNER_TEMP/baselines-committed" "$RUNNER_TEMP/baselines-written"; then
            echo "::error title=The brand baselines::the run wrote $(wc -l < "$RUNNER_TEMP/baselines-written" | tr -d ' ') baselines from nothing, not the $(wc -l < "$RUNNER_TEMP/baselines-committed" | tr -d ' ') committed"
            LC_ALL=C comm -23 "$RUNNER_TEMP/baselines-committed" "$RUNNER_TEMP/baselines-written" | sed 's/^/  committed, not written: /'
            LC_ALL=C comm -13 "$RUNNER_TEMP/baselines-committed" "$RUNNER_TEMP/baselines-written" | sed 's/^/  written, not committed: /'
            failed=1
          fi
          LC_ALL=C comm -12 "$RUNNER_TEMP/baselines-committed" "$RUNNER_TEMP/baselines-written" | while IFS= read -r file; do
            cmp -s "$file" "$fresh/$file" || printf '%s\n' "$file"
          done > "$RUNNER_TEMP/baselines-differ"
          if [ -s "$RUNNER_TEMP/baselines-differ" ]; then
            echo "::error title=The brand baselines::this runner renders other bytes than the committed baselines: inspect the pictures below and commit them (docs/runbooks/ci.md, \"Upgrading the browser\")"
            sed 's/^/  differs: /' "$RUNNER_TEMP/baselines-differ"
            failed=1
          fi
          (cd "$fresh" && find apps -type f -name '*.png' -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum)
          if [ "$failed" -ne 0 ]; then
            { cat "$RUNNER_TEMP/baselines-differ"; LC_ALL=C comm -13 "$RUNNER_TEMP/baselines-committed" "$RUNNER_TEMP/baselines-written"; } | LC_ALL=C sort -u | (cd "$fresh" && "$printer")
          fi
          exit "$failed"
      # Compose prints no container's log when the job ends, as a service container's was: the database's last lines,
      # past the quiet step's refusals, when anything failed.
      - name: The database's log
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres

  # Both production images, built from their Dockerfiles into archives and scanned there with Trivy, failing on any HIGH
  # or CRITICAL finding that has a fix (PRD 16 and 18; docs/adr/0010). One job for both, to spare a concurrency slot: the
  # worker is built and scanned whatever the web image's result. On ubuntu-26.04, whose Docker keeps images in the
  # containerd store, each pull request also proves the release's identity rules there (docs/adr/0066, Part 3): each
  # archive's config digest, read from its bytes by tools/screening-capacity/image-id.ts, is the one buildx reports;
  # the worker loads as the archive's top-level descriptor; and its headless shell, which prints customers' reports, is
  # held to apps/web/e2e/browser.json.
  images:
    runs-on: ubuntu-26.04
    # About 4 minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # The builder by digest (BuildKit v0.34.1), the same on every setup-buildx step, not the driver's default
      # moby/buildkit:buildx-stable-1 by tag; Dependabot cannot update this string, so tools/check-action-pins warns when a
      # newer release is three days old (docs/runbooks/dependency-upgrades.md).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - name: The images' directory
        run: mkdir -p "$RUNNER_TEMP/image"
      # Each image as an archive (buildx's type=docker export), with no attestation manifest, so either image store
      # holds one manifest for it and the scan reads the bytes the checks read.
      - name: Build the web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: tp-web:scan
          outputs: type=docker,dest=${{ runner.temp }}/image/web.tar
          provenance: false
          sbom: false
      - name: Scan the web image (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image/web.tar
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # The vulnerability database the verdict is made from, downloaded by this run, never one another run cached,
          # and kept outside the workspace, the worker image's build context.
          cache: false
          cache-dir: ${{ runner.temp }}/trivy
      - name: Build the worker image
        id: worker
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: tp-worker:scan
          outputs: type=docker,dest=${{ runner.temp }}/image/worker.tar
          provenance: false
          sbom: false
      - name: Scan the worker image (fails on HIGH or CRITICAL)
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image/worker.tar
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # The vulnerability database the verdict is made from, downloaded by this run, never one another run cached,
          # and kept outside the workspace, the worker image's build context.
          cache: false
          cache-dir: ${{ runner.temp }}/trivy
      # Node 24 for the two node:-only scripts below, with no cache: nothing is installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 24
          package-manager-cache: false
      - name: The web archive holds the image buildx built
        if: ${{ !cancelled() && steps.web.outcome == 'success' }}
        env: { METADATA: "${{ steps.web.outputs.metadata }}" }
        run: |
          built="$(jq -r '."containerimage.config.digest" // empty' <<< "$METADATA")"
          read="$(node tools/screening-capacity/image-id.ts "$RUNNER_TEMP/image/web.tar" | jq -r '.config')"
          if [ -z "$built" ] || [ "$read" != "$built" ]; then
            echo "::error title=The web archive::its config digest is ${read:-unreadable}, and buildx built ${built:-nothing it reported}"
            exit 1
          fi
          echo "web: config $read"
      - name: The worker archive holds the image buildx built, and loads as itself
        id: worker-identity
        if: ${{ !cancelled() && steps.worker.outcome == 'success' }}
        env: { METADATA: "${{ steps.worker.outputs.metadata }}" }
        run: |
          built="$(jq -r '."containerimage.config.digest" // empty' <<< "$METADATA")"
          identity="$(node tools/screening-capacity/image-id.ts "$RUNNER_TEMP/image/worker.tar")"
          config="$(jq -r '.config' <<< "$identity")"
          target="$(jq -r '.target // empty' <<< "$identity")"
          if [ -z "$built" ] || [ "$config" != "$built" ]; then
            echo "::error title=The worker archive::its config digest is $config, and buildx built ${built:-nothing it reported}"
            exit 1
          fi
          docker load --input "$RUNNER_TEMP/image/worker.tar"
          store=classic
          if [ "$(docker info --format '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')" = io.containerd.snapshotter.v1 ]; then
            store=containerd
          fi
          if [ "$store" = containerd ]; then want="$target"; else want="$config"; fi
          id="$(docker image inspect -f '{{.Id}}' tp-worker:scan)"
          if [ -z "$want" ] || [ "$id" != "$want" ]; then
            echo "::error title=The worker archive::tp-worker:scan loaded as $id on the $store image store, not the archive's ${want:-digest for it}"
            exit 1
          fi
          echo "worker: config $config, target $target, loaded as $id on the $store image store"
      - name: The worker image's headless shell is browser.json's
        if: ${{ !cancelled() && steps.worker-identity.outcome == 'success' }}
        run: node tools/ci/browser-build.ts --image tp-worker:scan

  # The required check (docs/runbooks/github-governance.md, step 4A): every job above, each of whose results it prints
  # to its log and its summary, and it passes only when every one succeeded. It runs whatever they did, a cancelled run
  # included: GitHub counts a job its own condition skipped as passing a required check, so a gate skipped on a cancel
  # would pass. It checks nothing out (tools/test/ci-gate.test.ts runs this script on every kind of result).
  all-green:
    name: all green
    if: ${{ always() }}
    needs: [static, lint, unit, db, domain-model, build, e2e, images]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job's result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null; then
            echo "all green: every job it needs succeeded ($(echo "$NEEDS" | jq 'length') jobs)."
          else
            echo "::error title=all green::$(echo "$NEEDS" | jq -r 'if length == 0 then "no job reported a result" else "not every job succeeded: " + ([to_entries[] | select(.value.result != "success") | "\(.key) \(.value.result)"] | join(", ")) end')"
            exit 1
          fi
