name: release

# On a release tag (PRD sections 15 and 18: promotion is by tagged image; decision 13 of the founder's rulings of
# 2026-10-20 and docs/adr/0062): build each image once, scan it (any HIGH or CRITICAL finding with a fix stops the
# release) and describe it by a software bill of materials (SPDX JSON, kept with the run), measure the screening's
# capacity with time enforced on exactly the production web image and the worker image that were built, then push exactly
# the images that were built and scanned, never a rebuild. The capacity report is attested by this workflow's run
# (GitHub's artifact attestation, signed for .github/workflows/release.yml at the tag), and the report, its SHA-256, its
# summary and the attestation's bundle are kept as assets of the tag's GitHub release (release assets do not expire),
# where production's deploy reads them: the CDK app runs the launch check at synthesis (infra/lib/screening-launch.ts,
# tools/screening-capacity/launch-check.ts), which verifies the attestation with gh and opens production's screening only
# for this workflow's passing report on the images the stack deploys.
#
# The web image is built three times, each with its own static host (Next writes the asset prefix into the build;
# docs/adr/0055): `web` with none (its assets load from the application host), and `web-staging` and `web-production`
# with each environment's CloudFront origin from a repository variable, set once that environment's StaticAssetsOrigin
# output exists. Images are pushed to the repository's GitHub container registry; no workflow has credentials to an
# environment that holds PHI. A capacity run that fails does not stop the push, because a security fix must ship: it
# keeps production's screening closed instead (no passing report, no launch value).
#
# It restores no cache: a tag's run may restore caches its default branch saved, which the build branch is until launch
# (the founder's F1), so a cached scale release, scanner, vulnerability database, buildx binary or pnpm store would let
# another run's bytes into what is scanned, measured and attested. Every one is made in this run (docs/adr/0062;
# docs/adr/0066, Part 2): no actions/cache step, setup-node without a cache, setup-buildx without its binary cache, no
# build cache, and Trivy with its cache off. tools/check-action-pins follows every actions/cache step a composite nests
# to the input that turns it off, failing closed where it cannot follow; a JavaScript action's built-in cache is code it
# cannot read, so tools/test/workflows.test.ts holds the explicit inputs that turn each one off. Its uploads overwrite,
# so a re-run of a failed job replaces what its first attempt left. A pull request that changes this file runs its
# actions in release-dry-run.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# GitHub's bash with pipefail (bash --noprofile --norc -eo pipefail), so a failed docker save fails its step rather than
# leave gzip's success.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        image: [web, web-staging, web-production, worker]
    # Each image's identity, written by its own leg under its own names, so no leg overwrites another's: the gzipped
    # archive's SHA-256, and the config digest and top-level descriptor read from the archive's bytes
    # (tools/screening-capacity/image-id.ts). A job's outputs are fixed when it ends, and no later job can write them, so
    # every job that loads an archive checks it against these, never against the files that travel with it: capacity
    # runs repository code and every installed package beside push (docs/adr/0066, Part 3).
    outputs:
      sha256_web: ${{ steps.identity.outputs.sha256_web }}
      config_web: ${{ steps.identity.outputs.config_web }}
      target_web: ${{ steps.identity.outputs.target_web }}
      sha256_web-staging: ${{ steps.identity.outputs.sha256_web-staging }}
      config_web-staging: ${{ steps.identity.outputs.config_web-staging }}
      target_web-staging: ${{ steps.identity.outputs.target_web-staging }}
      sha256_web-production: ${{ steps.identity.outputs.sha256_web-production }}
      config_web-production: ${{ steps.identity.outputs.config_web-production }}
      target_web-production: ${{ steps.identity.outputs.target_web-production }}
      sha256_worker: ${{ steps.identity.outputs.sha256_worker }}
      config_worker: ${{ steps.identity.outputs.config_worker }}
      target_worker: ${{ steps.identity.outputs.target_worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder by digest (BuildKit v0.34.1), the same on every setup-buildx step, not the driver's default
      # moby/buildkit:buildx-stable-1 by tag; Dependabot cannot update this string, so tools/check-action-pins warns when a
      # newer release is three days old (docs/runbooks/dependency-upgrades.md).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - id: image
        name: Name the image, its Dockerfile and its static host
        env:
          IMAGE: ${{ matrix.image }}
          STAGING_ORIGIN: ${{ vars.STAGING_STATIC_ASSET_ORIGIN }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_STATIC_ASSET_ORIGIN }}
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          case "$IMAGE" in
            worker) echo "dockerfile=apps/worker/Dockerfile" >> "$GITHUB_OUTPUT"; origin="" ;;
            web) echo "dockerfile=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"; origin="" ;;
            web-staging) echo "dockerfile=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"; origin="$STAGING_ORIGIN" ;;
            web-production) echo "dockerfile=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"; origin="$PRODUCTION_ORIGIN" ;;
          esac
          if [ "$IMAGE" != "web" ] && [ "$IMAGE" != "worker" ] && [ -z "$origin" ]; then
            echo "::warning::$IMAGE is built with no static host: its repository variable is not set yet, so its assets load from the application host"
          fi
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      # No attestation manifest from buildx, so either image store holds one manifest for the image (the release's
      # attestation is the report job's, its bill of materials Trivy's below).
      - name: Build the image without pushing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          provenance: false
          sbom: false
          build-args: |
            STATIC_ASSET_ORIGIN=${{ steps.image.outputs.origin }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Scan the image (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          cache: false
          cache-dir: ${{ runner.temp }}/trivy

      - name: Write the software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output: sbom-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
          exit-code: "0"
          cache: false
          cache-dir: ${{ runner.temp }}/trivy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}-${{ github.ref_name }}
          path: sbom-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
          if-no-files-found: error
          overwrite: true

      # Node 24 with no cache, for the two node:-only scripts below; nothing is installed in this job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The worker prints customers' reports with its headless shell: every file of it, inside the image that ships,
      # held to apps/web/e2e/browser.json before the image is saved (tools/ci/browser-build.ts).
      - name: Check the worker image's headless shell against browser.json
        if: ${{ matrix.image == 'worker' }}
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: node tools/ci/browser-build.ts --image "$REF"

      # The image as scanned, kept for the jobs below, which load it and never build. Its identity is read from the
      # archive's bytes, the tag is proved to be that image on this runner's image store (the config digest on the
      # classic store, the archive's top-level descriptor on the containerd store), and the archive's SHA-256 and both
      # digests leave as this job's outputs; the .tar.sha256 and .id beside the archive are for a person reading it.
      - name: Save the scanned image and record its identity
        id: identity
        env:
          REF: ${{ steps.image.outputs.ref }}
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker save "$REF" | gzip -1 > "$RUNNER_TEMP/image/$IMAGE.tar.gz"
          identity="$(node tools/screening-capacity/image-id.ts "$RUNNER_TEMP/image/$IMAGE.tar.gz")"
          config="$(jq -r '.config' <<< "$identity")"
          target="$(jq -r '.target // empty' <<< "$identity")"
          store=classic
          if [ "$(docker info --format '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')" = io.containerd.snapshotter.v1 ]; then
            store=containerd
          fi
          if [ "$store" = containerd ]; then want="$target"; else want="$config"; fi
          id="$(docker image inspect -f '{{.Id}}' "$REF")"
          if [ -z "$want" ] || [ "$id" != "$want" ]; then
            echo "::error title=$IMAGE::$REF is $id on the $store image store, not its archive's ${want:-digest for it}"
            exit 1
          fi
          sha="$(sha256sum "$RUNNER_TEMP/image/$IMAGE.tar.gz" | cut -d ' ' -f 1)"
          echo "$sha  $IMAGE.tar.gz" > "$RUNNER_TEMP/image/$IMAGE.tar.sha256"
          echo "$config" > "$RUNNER_TEMP/image/$IMAGE.id"
          {
            echo "sha256_$IMAGE=$sha"
            echo "config_$IMAGE=$config"
            echo "target_$IMAGE=$target"
          } >> "$GITHUB_OUTPUT"
          echo "$IMAGE: archive SHA-256 $sha, config $config, top-level descriptor ${target:-none}, on the $store image store"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: |
            ${{ runner.temp }}/image/${{ matrix.image }}.tar.gz
            ${{ runner.temp }}/image/${{ matrix.image }}.tar.sha256
            ${{ runner.temp }}/image/${{ matrix.image }}.id
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  # Decision 13: the capacity test with time enforced and binding, on the production web image and the worker image
  # exactly as built and scanned (their IDs are the report's), on the same runner as
  # .github/workflows/screening-capacity.yml's measurement (GitHub's free 4-CPU runner, its CPUs shared), with its
  # timeout: 100 minutes, S4 three times (the founder's ruling of 2026-10-23, median of 3). Binding: a time above the
  # line fails this run, and only this run's binding report that passes, attested by the report job below, opens
  # production's screening (the founder's third ruling of 2026-10-23, "Free: time advisory", which made every other
  # capacity run advisory). The harness records this run (GITHUB_WORKFLOW_REF, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT) in the
  # report, which the launch check holds to this workflow on the tag. The launch check accepts only the layout this
  # runner gives (RELEASE_RUNNER in tools/screening-capacity/launch-check.ts; workflows.test.ts holds the two together),
  # which stays on ubuntu-24.04 while every other workflow's jobs move to ubuntu-26.04 (the founder's F5). Unlike ci.yml's
  # jobs, nothing here runs past a failed browser check: a measurement made with another browser than browser.json's
  # must never be attested as passing.
  capacity:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-web-production
          path: ${{ runner.temp }}/image
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-worker
          path: ${{ runner.temp }}/image

      # Before anything is installed: each archive's SHA-256 against the build's outputs, then the load, then the loaded
      # tag proved to be the image built on this runner's store (docs/adr/0066, Part 3).
      - name: Check each archive against the build's outputs and load it as the image built
        env:
          BUILD: ${{ toJSON(needs.build.outputs) }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          store=classic
          if [ "$(docker info --format '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')" = io.containerd.snapshotter.v1 ]; then
            store=containerd
          fi
          for image in web-production worker; do
            archive="$RUNNER_TEMP/image/$image.tar.gz"
            sha="$(jq -r --arg key "sha256_$image" '.[$key] // empty' <<< "$BUILD")"
            config="$(jq -r --arg key "config_$image" '.[$key] // empty' <<< "$BUILD")"
            target="$(jq -r --arg key "target_$image" '.[$key] // empty' <<< "$BUILD")"
            if [ -z "$sha" ] || [ -z "$config" ]; then
              echo "::error title=$image::the build job recorded no identity for $image"
              exit 1
            fi
            echo "$sha  $archive" | sha256sum --check --strict
            docker load --input "$archive"
            ref="$repository/$image:$GITHUB_REF_NAME"
            if [ "$store" = containerd ]; then want="$target"; else want="$config"; fi
            id="$(docker image inspect -f '{{.Id}}' "$ref")"
            if [ -z "$want" ] || [ "$id" != "$want" ]; then
              echo "::error title=$image::$ref loaded as $id on the $store image store, not the ${want:-digest} the build recorded"
              exit 1
            fi
            echo "$image: $id, the image built"
          done

      # pnpm and Node with no cache: the store is filled from the registry by the lockfile's integrity hashes.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: browser-install
        run: pnpm --filter @tp/web exec playwright install --with-deps chromium
      # Every file of the headless shell's and Chromium's builds against apps/web/e2e/browser.json, before the
      # measurement's browser uploads anything (tools/ci/browser-build.ts).
      - name: Check the browser builds against browser.json
        run: node tools/ci/browser-build.ts

      # The SYNTHETIC scale release, built in this run from this commit's generator, never one another run cached (about
      # 22 seconds).
      - name: Build the scale release
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec tsx tools/release/scale.ts --out "$RUNNER_TEMP/scale-release"

      # The harness's browser serves the web image's own /_next/static/ for production's static host, so the pages load
      # as they will in production and a request that would leave for CloudFront fails the run.
      - name: Measure the release's images under production limits
        env:
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_STATIC_ASSET_ORIGIN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          cpus=$(pnpm -s screening:capacity --print-harness-cpus)
          echo "harness on CPUs $cpus"
          set -- --out "$RUNNER_TEMP/screening-capacity" --release-dir "$RUNNER_TEMP/scale-release" \
            --web-image "$repository/web-production:$GITHUB_REF_NAME" --worker-image "$repository/worker:$GITHUB_REF_NAME" \
            --time-mode binding
          if [ -n "$PRODUCTION_ORIGIN" ]; then
            set -- "$@" --static-asset-origin "$PRODUCTION_ORIGIN"
          fi
          taskset -c "$cpus" pnpm screening:capacity "$@"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screening-capacity-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/screening-capacity/screening-capacity.json
            ${{ runner.temp }}/screening-capacity/screening-capacity.sha256
            ${{ runner.temp }}/screening-capacity/summary.md
            ${{ runner.temp }}/screening-capacity/logs/
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

  # The images as built and scanned, never a rebuild: loaded from the build's artifacts and pushed under the tag and the
  # commit. It does not wait for the capacity run (a security fix ships whatever the measurement says). It runs no
  # repository code (no checkout, no Node): every archive is checked against the build's outputs and every loaded image
  # proved the one built before the first push, and after the pushes the registry's manifests are read back, so what
  # was pushed is what was measured, in the form the launch check reads (docs/adr/0066, Part 3).
  push:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/image
          merge-multiple: true

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check each archive against the build's outputs and load it as the image built
        env:
          BUILD: ${{ toJSON(needs.build.outputs) }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          store=classic
          if [ "$(docker info --format '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')" = io.containerd.snapshotter.v1 ]; then
            store=containerd
          fi
          for image in web web-staging web-production worker; do
            archive="$RUNNER_TEMP/image/$image.tar.gz"
            sha="$(jq -r --arg key "sha256_$image" '.[$key] // empty' <<< "$BUILD")"
            config="$(jq -r --arg key "config_$image" '.[$key] // empty' <<< "$BUILD")"
            target="$(jq -r --arg key "target_$image" '.[$key] // empty' <<< "$BUILD")"
            if [ -z "$sha" ] || [ -z "$config" ]; then
              echo "::error title=$image::the build job recorded no identity for $image"
              exit 1
            fi
            echo "$sha  $archive" | sha256sum --check --strict
            docker load --input "$archive"
            ref="$repository/$image:$GITHUB_REF_NAME"
            if [ "$store" = containerd ]; then want="$target"; else want="$config"; fi
            id="$(docker image inspect -f '{{.Id}}' "$ref")"
            if [ -z "$want" ] || [ "$id" != "$want" ]; then
              echo "::error title=$image::$ref loaded as $id on the $store image store, not the ${want:-digest} the build recorded"
              exit 1
            fi
            echo "$image: $id, the image built"
          done

      - name: Push the scanned images
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for image in web web-staging web-production worker; do
            ref="$repository/$image:$GITHUB_REF_NAME"
            docker tag "$ref" "$repository/$image:sha-$GITHUB_SHA"
            docker push "$ref"
            docker push "$repository/$image:sha-$GITHUB_SHA"
          done

      # Each pushed tag's manifest, read back from the registry (an index followed to its linux/amd64 manifest), names
      # the config digest the build recorded.
      - name: Check the registry holds the images built
        env:
          BUILD: ${{ toJSON(needs.build.outputs) }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for image in web web-staging web-production worker; do
            config="$(jq -r --arg key "config_$image" '.[$key] // empty' <<< "$BUILD")"
            for ref in "$repository/$image:$GITHUB_REF_NAME" "$repository/$image:sha-$GITHUB_SHA"; do
              raw="$(docker buildx imagetools inspect --raw "$ref")"
              case "$(jq -r '.mediaType // empty' <<< "$raw")" in
                application/vnd.oci.image.index.v1+json | application/vnd.docker.distribution.manifest.list.v2+json)
                  digest="$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else empty end' <<< "$raw")"
                  if [ -z "$digest" ]; then
                    echo "::error title=$image::$ref is an index without exactly one linux/amd64 manifest"
                    exit 1
                  fi
                  raw="$(docker buildx imagetools inspect --raw "$repository/$image@$digest")"
                  ;;
              esac
              pushed="$(jq -r '.config.digest // empty' <<< "$raw")"
              if [ -z "$config" ] || [ "$pushed" != "$config" ]; then
                echo "::error title=$image::the registry's $ref names the config ${pushed:-nothing}, not the ${config:-digest} the build recorded"
                exit 1
              fi
              echo "$ref: config $pushed, the image built"
            done
          done

  # The report attested and kept, with its SHA-256, its summary and the attestation's bundle, as assets of the tag's
  # GitHub release, a failing one too (the launch check refuses it). The attestation (the verification of PR 6b-3's
  # capacity changes) binds the report's bytes to this workflow's run on the tag: Sigstore's certificate names
  # release.yml at refs/tags/<tag>, the commit, the run and its attempt, from GitHub's OIDC token, which the launch check
  # verifies with gh attestation verify against the bundle kept here; a report measured anywhere else, or changed by one
  # byte, has none. The only job that may write to the repository, mint an OIDC token or write attestations, and it runs
  # nothing but the attestation action and gh, never the code it measured. Attestations are free for a public repository;
  # a private one needs GitHub Enterprise Cloud (docs/runbooks/screening-capacity.md, "Provenance"). A re-run replaces
  # the assets, and every attempt's attestation stays in the repository's attestations.
  report:
    needs: capacity
    if: ${{ !cancelled() && needs.capacity.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screening-capacity-${{ github.ref_name }}
          path: ${{ runner.temp }}/screening-capacity

      - id: attest
        name: Attest the capacity report as this workflow's on the tag
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/screening-capacity/screening-capacity.json

      - name: Keep the capacity report and its attestation with the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/screening-capacity/screening-capacity.sigstore.json"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes "The release's screening capacity report and its attestation are attached."
          gh release upload "$TAG" --clobber \
            "$RUNNER_TEMP/screening-capacity/screening-capacity.json" \
            "$RUNNER_TEMP/screening-capacity/screening-capacity.sha256" \
            "$RUNNER_TEMP/screening-capacity/summary.md" \
            "$RUNNER_TEMP/screening-capacity/screening-capacity.sigstore.json"
