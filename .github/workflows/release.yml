name: release

# On a release tag, build and tag the web and worker container images (PRD sections 15 and 18:
# promotion is by tagged image). Each image is built, scanned (any HIGH or CRITICAL finding with a fix
# stops the release) and described by a software bill of materials (SPDX JSON, kept with the run)
# before it is pushed (PRD section 16). Images are pushed to the repository's GitHub container
# registry; no workflow has credentials to an environment that holds PHI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Name the image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - name: Build the image without pushing it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}

      - name: Scan the image (fails on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Write the software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          format: spdx-json
          output: sbom-${{ matrix.app }}-${{ github.ref_name }}.spdx.json
          exit-code: "0"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.app }}-${{ github.ref_name }}
          path: sbom-${{ matrix.app }}-${{ github.ref_name }}.spdx.json
          if-no-files-found: error

      - name: Push the scanned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
