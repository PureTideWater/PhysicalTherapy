name: screening-capacity

# The free screening's capacity test under production limits (audit #53 part 1; docs/adr/0062, "Capacity under
# production limits"; docs/runbooks/screening-capacity.md): the production images run as containers under production's
# task sizes (half a vCPU and 1 GiB for web, the founder's ruling of 2026-10-22, and a quarter vCPU and 512 MiB for
# platform; the screening consumer, WORKER_JOBS=screening, at 2 vCPU and 4 GiB pricing three at once), Postgres at
# db.t4g.medium's 2 vCPU and 4 GiB with gp3's I/O baseline and a 1 ms delay each way, the SYNTHETIC scale release
# 900100 and the practice and worst 50,000-row uploads, alone and three at once with a small one behind them. Time is
# judged against 48 s on the runner (decisions 13 to 16, the founder's rulings of 2026-10-20; PR 6b-3) and is advisory
# here (the founder's third ruling of 2026-10-23, "Free: time advisory"): on every event this workflow runs on, none a
# release, a time above the line is a warning on the checks and every other check fails the job; a release's capacity
# run (release.yml) is binding, and production's screening opens only on its pass (decision 13). The measurement runs on
# GitHub's free 4-CPU runner, its CPUs shared as before the 8-core ruling, which needed an organization. The three worst
# at once (S4) run three times and their time is judged on the middle run, every other check in all three (the
# founder's first ruling of 2026-10-23, median of 3). Synthetic data only, no credentials.
#
# A required check from PR 6b-3 on (the founder's Q8 of 2026-10-21; the founder sets the ruleset, runbook
# screening-capacity "Making it required"): every pull request runs the workflow, and its "screening-capacity gate" job
# passes at once when no watched path changed, else only when the measurement passed every check but time, whose
# verdicts it carries as warnings. A path filter on the trigger would leave a required check pending forever on every
# other pull request.
on:
  schedule:
    # Weekly. Schedules fire only from the default branch, so this one runs once it carries the workflows (audit #54).
    - cron: "41 6 * * 1"
  # On request, on the release's runner by default, or once on ubuntu-26.04 as an advisory probe whose numbers decide the
  # capacity chain's later move (the founder's F5; issue #41, O5): a dispatched 26.04 run opens no issue, and the launch
  # check refuses its report, which is not release.yml's attested run (the runner-image refusal lands after #42;
  # docs/adr/0066, Part 3).
  workflow_dispatch:
    inputs:
      runner:
        description: The runner image to measure on (ubuntu-26.04 is an advisory probe)
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-24.04
  # A push to the build branch measures any change to what the images or the harness are built from; a pull request
  # measures one that changes a path of the derived watched list (the changes job below).
  push:
    branches: [claude/build-platform]
    paths:
      - apps/web/**
      - apps/worker/**
      - packages/**
      - tools/screening-capacity/**
      - tools/release/**
      - tools/content-files.ts
      - tools/verify-content/**
      - infra/lib/**
      - fixtures/synthetic/rules/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - docker-compose.yml
      # The capacity job's own setup scripts: its cached system packages' check and its browser check.
      - tools/ci/apt-archives.sh
      - tools/ci/browser-build.ts
      - .github/workflows/screening-capacity.yml
  # Every pull request: the gate decides from its changed files (the changes job's watched list) whether to measure.
  pull_request:

permissions:
  contents: read

# Every push is measured (grouped by its commit, never cancelled); only a pull request's older run is cancelled.
concurrency:
  group: screening-capacity-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether to measure: always outside a pull request; on one, when it changes a path of the watched list
  # (tools/screening-capacity/watched-paths.txt: every file the measured images and the harness import, derived from
  # their entry points by tools/screening-capacity/watched.ts and held to it by a unit test, and the files no import
  # reaches, the lockfile, manifests and migrations among them), as the base commit keeps it and as the pull request
  # does, so a pull request cannot drop its own path. Reads file names and that list only: no install, no repository
  # code run.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.watched.outputs.measure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Read the changed paths
        id: watched
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A diff that cannot be read fails the step (and so the gate), never reads as "nothing changed".
          git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed-paths"
          list=tools/screening-capacity/watched-paths.txt
          # The list as the base keeps it and as the pull request does; a base without one (before PR 6b-3) measures.
          if ! git cat-file -e "$BASE:$list" 2>/dev/null; then
            echo "the base keeps no watched list: measure"
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { git show "$BASE:$list"; git show "$HEAD:$list" 2>/dev/null || true; } | grep -v -e '^#' -e '^$' | sort -u > "$RUNNER_TEMP/watched"
          measure=false
          while IFS= read -r file; do
            while IFS= read -r pattern; do
              # A path as it is (one may hold brackets, as app/screening/results/[resultId]/ does), else the line as a
              # shell pattern, unquoted so its * matches (across / too).
              if [ "$file" = "$pattern" ]; then
                measure=true
                echo "watched: $file"
                break
              fi
              # shellcheck disable=SC2254
              case "$file" in
                $pattern)
                  measure=true
                  echo "watched: $file"
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/watched"
          done < "$RUNNER_TEMP/changed-paths"
          echo "measure=$measure" >> "$GITHUB_OUTPUT"

  capacity:
    needs: changes
    if: needs.changes.outputs.measure == 'true'
    outputs:
      sizing: ${{ steps.measure.outputs.sizing }}
      time-warnings: ${{ steps.measure.outputs.time-warnings }}
    # GitHub's free 4-CPU runner for a public repository (the founder's third ruling of 2026-10-23, "Free: time
    # advisory": GitHub's larger runners exist only for an organization on GitHub Team or Enterprise Cloud, and
    # PureTideWater is a personal account). Postgres keeps db.t4g.medium's 2 vCPU on 0-1, shared with the harness and
    # Chromium, and the consumer its 2 on 2-3, whose last the web and the platform share (limits.ts, cpuLayout); a smaller
    # runner stops as "runner too small". Once the repository is private its standard runner has 2, so this label (and the
    # release's capacity job's, the same runner) becomes a 4-core larger runner, which needs an organization on GitHub
    # Team (docs/runbooks/screening-capacity.md, "The 8-core runner"); until then a private run is refused as too small
    # and the screening cannot open. ubuntu-24.04, the release's runner (RELEASE_RUNNER in launch-check.ts), on every
    # event but a dispatch that names ubuntu-26.04: the advisory probe of the founder's F5, while every other job of every
    # workflow but the release's capacity chain runs on ubuntu-26.04.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    # A run takes 30 to 60 minutes (the scale release, two image builds, five scenarios, S4 three times); a hung scenario
    # stops at 100 instead of GitHub's 360 (docs/adr/0063). S4's two more runs (the founder's ruling of 2026-10-23) need
    # about 3 minutes: CI's S4 took 59 s on 19aa09c and 78 s on 54ec890 from its cold restart (about 20 s) to S5's start;
    # 10 minutes more than the 90 before them leave the margin.
    timeout-minutes: 100
    steps:
      # The harness calls no GitHub API and pushes nothing, so the token is not left in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder by digest (BuildKit v0.34.1), the same on every setup-buildx step, not the driver's default
      # moby/buildkit:buildx-stable-1 by tag. Its age is held by tools/check-toolchain's image rule, as every image's
      # is; Dependabot cannot update this string, so tools/check-action-pins warns when a newer release is three days
      # old (docs/runbooks/dependency-upgrades.md).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      # The production images, from their Dockerfiles, as ci.yml's images job builds them: each as an archive with no
      # attestation manifest, loaded below once its identity is read from its bytes. Every run reads the layer cache;
      # only a push to the build branch writes it, and only the final layers (mode=min): both Dockerfiles copy the whole
      # checkout before installing, so the install and build layers change with every commit and exporting them each run
      # would churn the repository's 10 GB of Actions cache (audit #53 part 1's capacity review).
      - name: The images' directory
        run: mkdir -p "$RUNNER_TEMP/image"
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: tp-web:capacity
          outputs: type=docker,dest=${{ runner.temp }}/image/web.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=screening-capacity-web
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/build-platform' && 'type=gha,mode=min,scope=screening-capacity-web' || '' }}

      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: tp-worker:capacity
          outputs: type=docker,dest=${{ runner.temp }}/image/worker.tar
          provenance: false
          sbom: false
          cache-from: type=gha,scope=screening-capacity-worker
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/build-platform' && 'type=gha,mode=min,scope=screening-capacity-worker' || '' }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      # Each archive's identity read from its bytes (tools/screening-capacity/image-id.ts, node: modules only), then the
      # load, then the loaded tag proved to be that image on this runner's store: the config digest on the classic store,
      # the archive's top-level descriptor on the containerd store (docs/adr/0066, Part 3).
      - name: Load the images as built
        run: |
          store=classic
          if [ "$(docker info --format '{{range .DriverStatus}}{{if eq (index . 0) "driver-type"}}{{index . 1}}{{end}}{{end}}')" = io.containerd.snapshotter.v1 ]; then
            store=containerd
          fi
          for image in web worker; do
            identity="$(node tools/screening-capacity/image-id.ts "$RUNNER_TEMP/image/$image.tar")"
            config="$(jq -r '.config' <<< "$identity")"
            target="$(jq -r '.target // empty' <<< "$identity")"
            docker load --input "$RUNNER_TEMP/image/$image.tar"
            if [ "$store" = containerd ]; then want="$target"; else want="$config"; fi
            id="$(docker image inspect -f '{{.Id}}' "tp-$image:capacity")"
            if [ -z "$want" ] || [ "$id" != "$want" ]; then
              echo "::error title=$image::tp-$image:capacity loaded as $id on the $store image store, not its archive's ${want:-digest for it}"
              exit 1
            fi
            echo "$image: config $config, loaded as $id on the $store image store"
          done
      # The worker image measured here prints customers' reports with its headless shell: every file of it, inside the
      # image loaded (a cached layer included), held to apps/web/e2e/browser.json before anything is installed or
      # measured (tools/ci/browser-build.ts, node: modules only; docs/adr/0066, Part 3).
      - name: Check the worker image's headless shell against browser.json
        run: node tools/ci/browser-build.ts --image tp-worker:capacity
      - run: pnpm install --frozen-lockfile
      # The runner image's name and version, from the runner's own environment: the system packages' cache key, this
      # job's own (ubuntu24, or ubuntu26 for the probe).
      - name: The runner image
        id: runner-image
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error title=The runner image::the runner names no ImageOS or ImageVersion, so the system packages' cache has no key"
            exit 1
          fi
          echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # The .deb files Playwright's --with-deps fetched on an earlier run, each used only once its SHA-256 is the signed
      # index's for its exact version (tools/ci/apt-archives.sh; docs/adr/0066, Part 3).
      - name: Restore the browsers' system packages
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-v1-${{ steps.runner-image.outputs.key }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            apt-v1-${{ steps.runner-image.outputs.key }}-
            apt-v1-${{ steps.runner-image.outputs.os }}-
      - name: Check the restored system packages against the signed index
        run: tools/ci/apt-archives.sh verify "$RUNNER_TEMP/apt-archives"
      # The browser the uploads are sent from: Playwright's own Chromium, as ci.yml installs it.
      - id: browser-install
        run: pnpm --filter @tp/web exec playwright install --with-deps chromium
      # Every file of the headless shell's and Chromium's builds against apps/web/e2e/browser.json. Unlike ci.yml's
      # jobs, nothing here runs past a red check: a measurement is never made with another browser than the record's.
      - name: Check the browser builds against browser.json
        run: node tools/ci/browser-build.ts
      # This job's own system packages, on a miss, by the build branch's own runs only (a pull request's cache is its own
      # scope, which no other run reads).
      - name: Collect the system packages apt downloaded
        if: ${{ github.event_name != 'pull_request' && steps.apt.outputs.cache-hit != 'true' }}
        run: tools/ci/apt-archives.sh collect "$RUNNER_TEMP/apt-archives"
      - name: Save the browsers' system packages
        if: ${{ github.event_name != 'pull_request' && steps.apt.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.apt.outputs.cache-primary-key }}

      # The SYNTHETIC scale release, kept between runs by the SHA-256 of what generates it: built in a step of its own
      # and saved straight after, so a measurement that fails still leaves it cached for the next run.
      - name: Restore the scale release
        id: scale-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scale-release
          key: screening-scale-release-${{ hashFiles('packages/synth/src/release/**', 'tools/release/scale.ts', 'packages/rules/src/**', 'fixtures/synthetic/rules/release-synth-900001/**') }}
      - name: Build the scale release
        if: steps.scale-release.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec tsx tools/release/scale.ts --out "$RUNNER_TEMP/scale-release"
      - name: Save the scale release
        if: steps.scale-release.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scale-release
          key: ${{ steps.scale-release.outputs.cache-primary-key }}

      # The harness, its child processes and Chromium on Postgres's CPUs (0-1 on the free 4-CPU runner), never the
      # consumer's (2-3) or the CPU the web and the platform share (3): the layout's own answer (limits.ts, harnessCpus),
      # which the report records and the verdict holds them to. Time advisory: a time above the line is annotated as a
      # warning and handed to the gate, and every other failing check fails this step (report.ts, jobResult).
      - name: Measure under production limits
        id: measure
        run: |
          cpus=$(pnpm -s screening:capacity --print-harness-cpus)
          echo "harness on CPUs $cpus"
          taskset -c "$cpus" pnpm screening:capacity \
            --out "$RUNNER_TEMP/screening-capacity" \
            --release-dir "$RUNNER_TEMP/scale-release" \
            --web-image tp-web:capacity \
            --worker-image tp-worker:capacity \
            --time-mode advisory

      # The report (written after every scenario, so a run that stops still has its figures), its SHA-256 and the
      # services' logs (IDs, codes and numbers by the logger's allowlist, synthetic data, result links masked).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screening-capacity
          path: |
            ${{ runner.temp }}/screening-capacity/screening-capacity.json
            ${{ runner.temp }}/screening-capacity/screening-capacity.sha256
            ${{ runner.temp }}/screening-capacity/summary.md
            ${{ runner.temp }}/screening-capacity/logs/
          if-no-files-found: ignore
          retention-days: 90
          # One name a run: a re-run of the failed job replaces what its first attempt left.
          overwrite: true

  # The required check (Q8): passes at once when no watched path changed, else only when the measurement passed every
  # check but time, which is advisory here (the founder's third ruling of 2026-10-23): the measuring job then succeeded,
  # and its time warnings (the 48-s line, S4 judged on its middle run of three) are printed here again as warnings on the
  # pull request's checks. It runs whatever the other jobs did, a cancelled run included: GitHub reports a job its
  # condition skipped as a success for a required check, so a gate skipped on a cancel would pass with no measurement;
  # run, it fails (CAPACITY=cancelled). A run a newer push superseded fails only on the older commit, which no longer
  # gates the pull request. A worst judged time above 44 s also carries the founder's sizing question (O9) here, as a
  # warning.
  gate:
    name: screening-capacity gate
    needs: [changes, capacity]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Pass when nothing watched changed, else only on a passing measurement
        env:
          CHANGES: ${{ needs.changes.result }}
          MEASURE: ${{ needs.changes.outputs.measure }}
          CAPACITY: ${{ needs.capacity.result }}
          SIZING: ${{ needs.capacity.outputs.sizing }}
          TIME_WARNINGS: ${{ needs.capacity.outputs.time-warnings }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "the changed paths could not be read ($CHANGES)"
            exit 1
          fi
          if [ "$MEASURE" != "true" ]; then
            echo "no watched path changed: nothing to measure"
            exit 0
          fi
          if [ "$CAPACITY" != "success" ]; then
            echo "the capacity measurement did not pass ($CAPACITY): see its job's summary"
            exit 1
          fi
          if [ -n "$TIME_WARNINGS" ]; then
            echo "::warning title=Time (advisory)::$TIME_WARNINGS"
          fi
          if [ -n "$SIZING" ]; then
            echo "::warning title=Sizing question (O9)::$SIZING"
          fi
          echo "the capacity measurement passed every check but time, which is advisory here; a release's capacity run holds it binding"

  # A failure outside a pull request opens one issue, or comments on the one already open, but a dispatched ubuntu-26.04
  # probe's, which is advisory and goes to issue #41 by hand (the founder's F5). This job holds the workflow's only write
  # permission and runs no repository code: it checks nothing out.
  notify:
    needs: capacity
    if: failure() && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.runner == 'ubuntu-26.04')
    runs-on: ubuntu-26.04
    # One call to the issues API; a hung call stops at 5 minutes instead of GitHub's 360 (docs/adr/0063).
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the screening-capacity issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The screening capacity test failed on ${GITHUB_REF_NAME} at ${GITHUB_SHA}: ${RUN_URL}. The run's artifact holds screening-capacity.json and summary.md with each failing check."
          number=$(gh issue list --label screening-capacity --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh label create screening-capacity --description "The screening capacity test (audit #53)" --color B60205 2>/dev/null || true
            gh issue create --title "Screening capacity test failing" --label screening-capacity --body "$body"
          else
            gh issue comment "$number" --body "$body"
          fi
