name: large-zip

# The milestone 3 done check at full size: "a 2 GB zip queues per file" (PRD 6, Intake and documents;
# PRD 17). ci.yml (the plan's verbatim workflow) runs the same intake test on every pull request at 256
# MiB, what its runner's minutes allow; this runs it weekly, and on request, at 2048 MiB: a stream of
# SYNTHETIC 835 entries sealed into the local store, expanded by the intake job against PostgreSQL, one
# source_document and one parse_835 job per entry, in bounded memory. No credentials, synthetic data only.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project db apps/worker/src/intake/intake.large.db.test.ts
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          TP_LARGE_ZIP_MB: "2048"
