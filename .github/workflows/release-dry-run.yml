name: release-dry-run

# The release's chain without a release (docs/adr/0066, Part 2). Only a tag runs release.yml, and only the founder makes
# tags, so a change to it, to the actions it pins or to the images' Dockerfiles and their pnpm installer would otherwise
# run first on the founder's tag. On every pull request and push that changes one of those files, this runs release.yml's own build and
# hand-over steps on the web image: it builds the image as release.yml does, saves it with its identity, uploads it and
# downloads it as release.yml's jobs do, checks that the image loaded is the image built, and logs in to the GitHub
# container registry with the job's own token; it writes the image's bill of materials as release.yml does, and runs
# the capacity job's setup up to its frozen install with no cache. It never tags, pushes or attests, and holds no write
# permission.
# workflows.test.ts holds every step it shares with release.yml to the same action and the same inputs.
#
# Advisory: none of its jobs is a required check (the ruleset "Protect the build branch"), so its path filter can never
# leave a required check waiting.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-dry-run.yml
      - tools/screening-capacity/image-id.ts
      - apps/web/Dockerfile
      - apps/worker/Dockerfile
      - tools/check-toolchain/install-pnpm.sh
  push:
    branches: [claude/build-platform]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-dry-run.yml
      - tools/screening-capacity/image-id.ts
      - apps/web/Dockerfile
      - apps/worker/Dockerfile
      - tools/check-toolchain/install-pnpm.sh

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push run is never cancelled. Named for this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub's bash with pipefail, so a failed docker save fails its step rather than leave gzip's success.
defaults:
  run:
    shell: bash

jobs:
  # release.yml's build job for the web image alone, with no scan (ci.yml's images job scans both images on every pull
  # request) and no cache, as release.yml restores none.
  build:
    runs-on: ubuntu-24.04
    # About 6 minutes; three times that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The builder by digest (BuildKit v0.34.1), the same on every setup-buildx step, not the driver's default
      # moby/buildkit:buildx-stable-1 by tag; Dependabot cannot update this string, so tools/check-action-pins warns when a
      # newer release is three days old (docs/runbooks/dependency-upgrades.md).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      # A name of the release's form under a tag no release uses: a pull request's ref name (<n>/merge) is no image tag.
      - id: image
        name: Name the image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/web:dry-run-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Build the image without pushing it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            STATIC_ASSET_ORIGIN=
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dry-run

      # release.yml's bill of materials step, its output named for this run's one image: the same Trivy pin and inputs,
      # its cache off, so a change to them runs here before a tag. Then the file is read: SPDX with at least one package.
      - name: Write the software bill of materials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output: sbom-web-dry-run.spdx.json
          exit-code: "0"
          cache: false
          cache-dir: ${{ runner.temp }}/trivy
      - run: jq -e '.spdxVersion and (.packages | length > 0)' sbom-web-dry-run.spdx.json > /dev/null

      # release.yml's step, word for word: docker save and docker load keep the image's ID.
      - name: Save the built image
        env:
          REF: ${{ steps.image.outputs.ref }}
          IMAGE: web
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          docker save "$REF" | gzip -1 > "$RUNNER_TEMP/image/$IMAGE.tar.gz"
          docker image inspect -f '{{.Id}}' "$REF" > "$RUNNER_TEMP/image/$IMAGE.id"
          echo "$IMAGE: $(cat "$RUNNER_TEMP/image/$IMAGE.id")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-web
          path: |
            ${{ runner.temp }}/image/web.tar.gz
            ${{ runner.temp }}/image/web.id
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  # release.yml's push job up to its push: the download of every image artifact, the registry login and the identity
  # check, then nothing more. Read permissions only.
  push:
    needs: build
    runs-on: ubuntu-24.04
    # About 2 minutes; a hung login or load stops at 10.
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/image
          merge-multiple: true

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # release.yml's push script with its image list cut to the web image, its tag to this run's, and its tag and push
      # lines removed.
      - name: Load the image and check it is the one built
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for image in web; do
            docker load --input "$RUNNER_TEMP/image/$image.tar.gz"
            ref="$repository/$image:dry-run-$GITHUB_RUN_ID"
            id=$(docker image inspect -f '{{.Id}}' "$ref")
            if [ "$id" != "$(cat "$RUNNER_TEMP/image/$image.id")" ]; then
              echo "::error::$image is not the image that was scanned"
              exit 1
            fi
            echo "$image $id"
          done

  # release.yml's capacity job up to its frozen install (the ci-infra review's N4): the steps a tag runs first there,
  # each with release.yml's inputs (a download by name, pnpm/action-setup with cache: false, setup-node with
  # package-manager-cache: false, then pnpm install --frozen-lockfile), so a change to them runs on a pull request. The
  # measurement itself, 100 minutes on the production image, stays the tag's (and screening-capacity.yml's).
  capacity:
    needs: build
    runs-on: ubuntu-24.04
    # About 3 minutes; a hung download or install stops at 15.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-web
          path: ${{ runner.temp }}/image

      # pnpm and Node with no cache, as release.yml's capacity job: the store is filled from the registry by the
      # lockfile's integrity hashes.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
