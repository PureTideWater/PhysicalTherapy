name: large-zip

# The milestone 3 done check at full size: "a 2 GB zip queues per file" (PRD 6, Intake and documents;
# PRD 17). ci.yml runs the same intake test on every pull request at 256 MiB, in its database shards,
# what its runners' minutes allow; this runs it weekly, and on request, at 2048 MiB: a stream of
# SYNTHETIC 835 entries sealed into the local store, expanded by the intake job against PostgreSQL, one
# source_document and one parse_835 job per entry, in bounded memory. No credentials, synthetic data only.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# GitHub's bash with pipefail (bash --noprofile --norc -eo pipefail), as ci.yml and the release run theirs.
defaults:
  run:
    shell: bash

jobs:
  large-zip:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # PostgreSQL from docker-compose.yml in the background, as in ci.yml's database jobs (tools/ci/postgres.sh).
      - name: Start the database
        run: tools/ci/postgres.sh up
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The runner image's name and version, from the runner's own environment (the env context holds only what a
      # workflow sets): the system packages' cache key.
      - name: The runner image
        id: runner-image
        run: |
          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error title=The runner image::the runner names no ImageOS or ImageVersion, so the system packages' cache has no key"
            exit 1
          fi
          echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # The .deb files Playwright's --with-deps fetched on an earlier run, each used only once its SHA-256 is the signed
      # index's for its exact version (tools/ci/apt-archives.sh; docs/adr/0066, Part 3).
      - name: Restore the browsers' system packages
        id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-v1-${{ steps.runner-image.outputs.key }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
          restore-keys: |
            apt-v1-${{ steps.runner-image.outputs.key }}-
            apt-v1-${{ steps.runner-image.outputs.os }}-
      - name: Check the restored system packages against the signed index
        run: tools/ci/apt-archives.sh verify "$RUNNER_TEMP/apt-archives"
      # Playwright's Chromium before any vitest run of the db project, which fails on CI without it rather than skip a
      # printing test (tools/test/ci-chromium.ts; docs/adr/0066, Part 1).
      - id: browser-install
        run: pnpm --filter @tp/web exec playwright install --with-deps chromium
      # Every file of the headless shell's and Chromium's builds against apps/web/e2e/browser.json, before anything uses
      # them (docs/runbooks/ci.md, "Upgrading the browser").
      - name: Check the browser builds against browser.json
        run: node tools/ci/browser-build.ts
      - name: Wait for the database
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        run: tools/ci/postgres.sh wait
      - run: pnpm vitest run --project db apps/worker/src/intake/intake.large.db.test.ts
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' }}
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
          TP_LARGE_ZIP_MB: "2048"
      # The database's last lines when anything failed: compose prints no container's log when the job ends.
      - name: The database's log
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres
