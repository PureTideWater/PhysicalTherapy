<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="background:#ffffff" viewBox="0 0 760 572" role="img" aria-label="The pricing run sits at the center: remittance facts on the left, signed-off rules on the right, frozen outputs below" font-size="11.5"><defs><marker id="tmodel-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#111827">The pricing run sits at the center: facts left, signed-off rules right, frozen outputs below</text><text data-claude-text-id="subtitle" x="24" y="48" fill="#4b5563">Every PHI table carries the practice; rule releases are global and read-only</text><g data-claude-anchor="connectors" fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M124 108V120" marker-end="url(#tmodel-arrow)"></path><path d="M124 156V168" marker-end="url(#tmodel-arrow)"></path><path d="M124 204V216" marker-end="url(#tmodel-arrow)"></path><path d="M124 252V264" marker-end="url(#tmodel-arrow)"></path><path d="M224 282H280" marker-end="url(#tmodel-arrow)"></path><path d="M224 344H280" marker-end="url(#tmodel-arrow)"></path><path d="M536 138H480" marker-end="url(#tmodel-arrow)"></path><path d="M536 234H480" marker-end="url(#tmodel-arrow)"></path><path d="M380 356V380" marker-end="url(#tmodel-arrow)"></path><path d="M380 436V456H124V476" marker-end="url(#tmodel-arrow)"></path><path d="M380 456V476" marker-end="url(#tmodel-arrow)"></path><path d="M380 456H636V476" marker-end="url(#tmodel-arrow)"></path></g><g data-claude-anchor="practice"><rect x="24" y="72" width="200" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="practice" x="36" y="95" font-size="13" font-weight="600" fill="#111827">Practice (tenant), grants</text></g><g data-claude-anchor="document"><rect x="24" y="120" width="200" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="document" x="36" y="143" font-size="13" font-weight="600" fill="#111827">Source document (835)</text></g><g data-claude-anchor="remittance"><rect x="24" y="168" width="200" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="remittance" x="36" y="191" font-size="13" font-weight="600" fill="#111827">Remittance, balanced</text></g><g data-claude-anchor="claim"><rect x="24" y="216" width="200" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="claim" x="36" y="239" font-size="13" font-weight="600" fill="#111827">Claim, reversals linked</text></g><g data-claude-anchor="line"><rect x="24" y="264" width="200" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="line" x="36" y="287" font-size="13" font-weight="600" fill="#111827">Service line, adjustments</text></g><g data-claude-anchor="mapping"><rect x="24" y="316" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="mapping" x="36" y="340" font-size="13" font-weight="600" fill="#111827">Payer plan mapping</text><text data-claude-text-id="mapping-line" x="36" y="358" fill="#4b5563">To a contract version, by date</text></g><g data-claude-anchor="run"><rect x="280" y="120" width="200" height="236" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="run" x="292" y="144" font-size="13" font-weight="600" fill="#111827">Pricing run</text><text data-claude-text-id="run-a" x="292" y="168" fill="#111827">Practice, period</text><text data-claude-text-id="run-b" x="292" y="188" fill="#111827">Pinned release and versions</text><text data-claude-text-id="run-c" x="292" y="208" fill="#111827">Expected per line, with trace</text><text data-claude-text-id="run-d" x="292" y="228" fill="#111827">Unpriced reasons, coverage</text><text data-claude-text-id="run-e" x="292" y="248" fill="#111827">Variance by payer pattern</text><text data-claude-text-id="run-f" x="292" y="268" fill="#111827">New release means a new run</text><text data-claude-text-id="run-g" x="292" y="332" fill="#4b5563">Immutable once complete</text></g><g data-claude-anchor="cases"><rect x="280" y="380" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="cases" x="292" y="404" font-size="13" font-weight="600" fill="#111827">Line stages and cases</text><text data-claude-text-id="cases-line" x="292" y="422" fill="#4b5563">Grouped by payer pattern</text></g><g data-claude-anchor="release"><rect x="536" y="120" width="200" height="36" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="release" x="548" y="143" font-size="13" font-weight="600" fill="#111827">Rule release (numbered)</text></g><g data-claude-anchor="rules"><rect x="536" y="168" width="200" height="132" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="rules" x="548" y="192" font-size="13" font-weight="600" fill="#111827">Contract versions and rates</text><text data-claude-text-id="rules-a" x="548" y="214" fill="#111827">Method, parameters, flags</text><text data-claude-text-id="rules-b" x="548" y="232" fill="#111827">Page, quote, hash, approver</text><text data-claude-text-id="rules-c" x="548" y="250" fill="#111827">Effective windows, no overlap</text><text data-claude-text-id="rules-d" x="548" y="268" fill="#111827">Medicare files, thresholds</text><text data-claude-text-id="rules-e" x="548" y="292" fill="#4b5563">Signed off before it prices</text></g><g data-claude-anchor="packets"><rect x="24" y="476" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="packets" x="36" y="500" font-size="13" font-weight="600" fill="#111827">Packet versions</text><text data-claude-text-id="packets-line" x="36" y="518" fill="#4b5563">Verified, two approvers, hashed</text></g><g data-claude-anchor="ledger"><rect x="280" y="476" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="ledger" x="292" y="500" font-size="13" font-weight="600" fill="#111827">Ledger entries</text><text data-claude-text-id="ledger-line" x="292" y="518" fill="#4b5563">Signed, append-only</text></g><g data-claude-anchor="audit"><rect x="536" y="476" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="audit" x="548" y="500" font-size="13" font-weight="600" fill="#111827">Audit events</text><text data-claude-text-id="audit-line" x="548" y="518" fill="#4b5563">Every read and change</text></g><text data-claude-text-id="lbl-facts" x="24" y="62" fill="#4b5563">Facts, per practice</text><text data-claude-text-id="lbl-rules" x="536" y="62" fill="#4b5563">Rules, global and signed off</text><text data-claude-text-id="lbl-frozen" x="24" y="552" fill="#4b5563">Frozen once written; corrections are new rows</text></svg>