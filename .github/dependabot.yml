# Weekly dependency updates (PRD section 16, dependency and image hygiene): the pnpm workspace, the
# GitHub Actions the workflows use, and the base images of both Dockerfiles. Each update arrives as a
# pull request and passes every CI gate before a person merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/apps/web, /apps/worker]
    schedule:
      interval: weekly
