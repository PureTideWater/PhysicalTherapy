name: screening-capacity

# The free screening's capacity test under production limits (audit #53 part 1; docs/adr/0062, "Capacity under
# production limits"; docs/runbooks/screening-capacity.md): the production images run as containers under production's
# task sizes (half a vCPU and 1 GiB for web, the founder's ruling of 2026-10-22, and a quarter vCPU and 512 MiB for
# platform; the screening consumer, WORKER_JOBS=screening, at 2 vCPU and 4 GiB pricing three at once), Postgres at
# db.t4g.medium's 2 vCPU and 4 GiB with gp3's I/O baseline and a 1 ms delay each way, the SYNTHETIC scale release
# 900100 and the practice and worst 50,000-row uploads, alone and three at once with a small one behind them. Time is enforced: above 48 s on the runner fails (decisions 13 to 16, the founder's
# rulings of 2026-10-20; PR 6b-3). The measurement runs on GitHub's 8-core larger runner with Postgres, the consumer,
# the web, the platform and the harness each on CPUs of their own, as production has them (the founder's second ruling
# of 2026-10-23, "8-core runner"). The three worst at once (S4) run three times and their time is judged on the middle
# run, every other check in all three (the founder's first ruling of 2026-10-23, median of 3, kept on the larger
# runner). Synthetic data only, no credentials.
#
# A required check from PR 6b-3 on (the founder's Q8 of 2026-10-21; the founder sets the ruleset, runbook
# screening-capacity "Making it required"): every pull request runs the workflow, and its "screening-capacity gate" job
# passes at once when no watched path changed, else only when the measurement passed. A path filter on the trigger
# would leave a required check pending forever on every other pull request.
on:
  schedule:
    # Weekly. Schedules fire only from the default branch, so this one runs once it carries the workflows (audit #54).
    - cron: "41 6 * * 1"
  workflow_dispatch:
  # A push to the build branch measures any change to what the images or the harness are built from; a pull request
  # measures one that changes a path of the derived watched list (the changes job below).
  push:
    branches: [claude/build-platform]
    paths:
      - apps/web/**
      - apps/worker/**
      - packages/**
      - tools/screening-capacity/**
      - tools/release/**
      - tools/content-files.ts
      - tools/verify-content/**
      - infra/lib/**
      - fixtures/synthetic/rules/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/screening-capacity.yml
  # Every pull request: the gate decides from its changed files (the changes job's watched list) whether to measure.
  pull_request:

permissions:
  contents: read

# Every push is measured (grouped by its commit, never cancelled); only a pull request's older run is cancelled.
concurrency:
  group: screening-capacity-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether to measure: always outside a pull request; on one, when it changes a path of the watched list
  # (tools/screening-capacity/watched-paths.txt: every file the measured images and the harness import, derived from
  # their entry points by tools/screening-capacity/watched.ts and held to it by a unit test, and the files no import
  # reaches, the lockfile, manifests and migrations among them), as the base commit keeps it and as the pull request
  # does, so a pull request cannot drop its own path. Reads file names and that list only: no install, no repository
  # code run.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.watched.outputs.measure }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Read the changed paths
        id: watched
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A diff that cannot be read fails the step (and so the gate), never reads as "nothing changed".
          git diff --name-only "$BASE...$HEAD" > "$RUNNER_TEMP/changed-paths"
          list=tools/screening-capacity/watched-paths.txt
          # The list as the base keeps it and as the pull request does; a base without one (before PR 6b-3) measures.
          if ! git cat-file -e "$BASE:$list" 2>/dev/null; then
            echo "the base keeps no watched list: measure"
            echo "measure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          { git show "$BASE:$list"; git show "$HEAD:$list" 2>/dev/null || true; } | grep -v -e '^#' -e '^$' | sort -u > "$RUNNER_TEMP/watched"
          measure=false
          while IFS= read -r file; do
            while IFS= read -r pattern; do
              # A path as it is (one may hold brackets, as app/screening/results/[resultId]/ does), else the line as a
              # shell pattern, unquoted so its * matches (across / too).
              if [ "$file" = "$pattern" ]; then
                measure=true
                echo "watched: $file"
                break
              fi
              # shellcheck disable=SC2254
              case "$file" in
                $pattern)
                  measure=true
                  echo "watched: $file"
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/watched"
          done < "$RUNNER_TEMP/changed-paths"
          echo "measure=$measure" >> "$GITHUB_OUTPUT"

  capacity:
    needs: changes
    if: needs.changes.outputs.measure == 'true'
    outputs:
      sizing: ${{ steps.measure.outputs.sizing }}
    # GitHub's 8-core larger runner (the founder's ruling of 2026-10-23 on the runner; Linux x64, 8 cores, 32 GB), which
    # the founder creates under this name with the Ubuntu 24.04 image chosen in its settings, so its image is pinned
    # there as ubuntu-24.04 pins the other jobs' (audit #19). Each service on CPUs of its own: Postgres 0-1 (db.t4g.medium's
    # 2 vCPU), the consumer 2-3, the web 4, the platform 5, the harness and Chromium 6-7 (limits.ts, cpuLayout); a runner
    # with fewer than 8 CPUs stops as "runner too small". The release's capacity job runs on the same runner. Until the
    # runner exists this job waits in GitHub's queue and the gate does not pass (docs/runbooks/screening-capacity.md,
    # "The 8-core runner").
    runs-on: paidwhole-8core
    # A run takes 30 to 60 minutes (the scale release, two image builds, five scenarios, S4 three times); a hung scenario
    # stops at 100 instead of GitHub's 360 (docs/adr/0063). S4's two more runs (the founder's ruling of 2026-10-23) need
    # about 3 minutes: CI's S4 took 59 s on 19aa09c and 78 s on 54ec890 from its cold restart (about 20 s) to S5's start;
    # 10 minutes more than the 90 before them leave the margin.
    timeout-minutes: 100
    steps:
      # The harness calls no GitHub API and pushes nothing, so the token is not left in the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The production images, from their Dockerfiles, as supply-chain.yml builds them. Every run reads the layer cache;
      # only a push to the build branch writes it, and only the final layers (mode=min): both Dockerfiles copy the whole
      # checkout before installing, so the install and build layers change with every commit and exporting them each run
      # would churn the repository's 10 GB of Actions cache (audit #53 part 1's capacity review).
      - name: Build the web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: tp-web:capacity
          cache-from: type=gha,scope=screening-capacity-web
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/build-platform' && 'type=gha,mode=min,scope=screening-capacity-web' || '' }}

      - name: Build the worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/worker/Dockerfile
          load: true
          push: false
          tags: tp-worker:capacity
          cache-from: type=gha,scope=screening-capacity-worker
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/build-platform' && 'type=gha,mode=min,scope=screening-capacity-worker' || '' }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The browser the uploads are sent from: Playwright's own Chromium, as ci.yml installs it.
      - run: pnpm --filter @tp/web exec playwright install --with-deps chromium

      # The SYNTHETIC scale release, kept between runs by the SHA-256 of what generates it: built in a step of its own
      # and saved straight after, so a measurement that fails still leaves it cached for the next run.
      - name: Restore the scale release
        id: scale-release
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scale-release
          key: screening-scale-release-${{ hashFiles('packages/synth/src/release/**', 'tools/release/scale.ts', 'packages/rules/src/**', 'fixtures/synthetic/rules/release-synth-900001/**') }}
      - name: Build the scale release
        if: steps.scale-release.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec tsx tools/release/scale.ts --out "$RUNNER_TEMP/scale-release"
      - name: Save the scale release
        if: steps.scale-release.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scale-release
          key: ${{ steps.scale-release.outputs.cache-primary-key }}

      # The harness, its child processes and Chromium on CPUs of their own (6-7 on the 8-core runner), never a service's:
      # the layout's own answer (limits.ts, harnessCpus), which the report records and the verdict holds them to.
      - name: Measure under production limits
        id: measure
        run: |
          cpus=$(pnpm -s screening:capacity --print-harness-cpus)
          echo "harness on CPUs $cpus"
          taskset -c "$cpus" pnpm screening:capacity \
            --out "$RUNNER_TEMP/screening-capacity" \
            --release-dir "$RUNNER_TEMP/scale-release" \
            --web-image tp-web:capacity \
            --worker-image tp-worker:capacity

      # The report (written after every scenario, so a run that stops still has its figures), its SHA-256 and the
      # services' logs (IDs, codes and numbers by the logger's allowlist, synthetic data, result links masked).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screening-capacity
          path: |
            ${{ runner.temp }}/screening-capacity/screening-capacity.json
            ${{ runner.temp }}/screening-capacity/screening-capacity.sha256
            ${{ runner.temp }}/screening-capacity/summary.md
            ${{ runner.temp }}/screening-capacity/logs/
          if-no-files-found: ignore
          retention-days: 90

  # The required check (Q8): passes at once when no watched path changed, else only when the measurement passed. It runs
  # whatever the other jobs did, a cancelled run included: GitHub reports a job its condition skipped as a success for a
  # required check, so a gate skipped on a cancel would pass with no measurement; run, it fails (CAPACITY=cancelled).
  # A run a newer push superseded fails only on the older commit, which no longer gates the pull request. A passing
  # measurement whose worst judged time (S4's from its middle run of three) is above 44 s also carries the founder's
  # sizing question (O9) here, as a warning on the pull request's checks.
  gate:
    name: screening-capacity gate
    needs: [changes, capacity]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pass when nothing watched changed, else only on a passing measurement
        env:
          CHANGES: ${{ needs.changes.result }}
          MEASURE: ${{ needs.changes.outputs.measure }}
          CAPACITY: ${{ needs.capacity.result }}
          SIZING: ${{ needs.capacity.outputs.sizing }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "the changed paths could not be read ($CHANGES)"
            exit 1
          fi
          if [ "$MEASURE" != "true" ]; then
            echo "no watched path changed: nothing to measure"
            exit 0
          fi
          if [ "$CAPACITY" != "success" ]; then
            echo "the capacity measurement did not pass ($CAPACITY): see its job's summary"
            exit 1
          fi
          if [ -n "$SIZING" ]; then
            echo "::warning title=Sizing question (O9)::$SIZING"
          fi
          echo "the capacity measurement passed with time enforced"

  # A failure outside a pull request opens one issue, or comments on the one already open. This job holds the
  # workflow's only write permission and runs no repository code: it checks nothing out.
  notify:
    needs: capacity
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # One call to the issues API; a hung call stops at 5 minutes instead of GitHub's 360 (docs/adr/0063).
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the screening-capacity issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The screening capacity test failed on ${GITHUB_REF_NAME} at ${GITHUB_SHA}: ${RUN_URL}. The run's artifact holds screening-capacity.json and summary.md with each failing check."
          number=$(gh issue list --label screening-capacity --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh label create screening-capacity --description "The screening capacity test (audit #53)" --color B60205 2>/dev/null || true
            gh issue create --title "Screening capacity test failing" --label screening-capacity --body "$body"
          else
            gh issue comment "$number" --body "$body"
          fi
