# Weekly dependency updates (PRD section 16, dependency and image hygiene): the pnpm workspace, the GitHub Actions the
# workflows pin, the base images of both Dockerfiles and the PostgreSQL image of docker-compose.yml. Each update arrives
# as a pull request, passes every CI gate and is triaged by a person, who never merges one as it stands
# (docs/runbooks/dependency-upgrades.md). Every pull request runs ci.yml's parallel jobs, about 38 to 39 runner minutes
# (44 to 45 billed; docs/adr/0066), so updates are grouped, the three ecosystems run on three days, none of them Monday,
# when the weekly mutation, large-zip and capacity runs start, and few pull requests are open at once (docs/adr/0063).
# Dependabot reads this file from the default branch, which is claude/build-platform until launch (the founder's F1).
#
# Cooldown: npm waits 3 days, the workspace's minimumReleaseAge (pnpm-workspace.yaml), with no per-semver days, so no
# gate longer than the workspace's ever reaches pnpm; the actions and the images wait 7, the only cooldown key those
# ecosystems take (the co-founder's CQ1 (a)). Security updates take no cooldown, and check-toolchain holds a version
# under three days old to its dated exclude.
version: 2

multi-ecosystem-groups:
  # The Dockerfiles' node image and compose's postgres image in one pull request.
  container-images:
    schedule:
      interval: weekly
      day: wednesday
      time: "04:43"
      timezone: Etc/UTC

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "04:31"
      timezone: Etc/UTC
    # The seven version-update groups below and room for one update no group takes.
    open-pull-requests-limit: 8
    cooldown:
      default-days: 3
    # Each a deliberate upgrade pull request instead (docs/runbooks/dependency-upgrades.md).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: "@next/eslint-plugin-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: pg-boss
        update-types: ["version-update:semver-major"]
    # A dependency joins the first group that matches it, so the specific groups come before minor-and-patch.
    groups:
      # Red on the browser.json check by design until ADR 0058's baseline procedure runs.
      browser-tests:
        patterns: ["@playwright/test", "playwright", "playwright-core", "@axe-core/playwright", "axe-core"]
      # Through the evaluation gate, in a deliberate pull request.
      anthropic-sdk:
        patterns: ["@anthropic-ai/sdk"]
      # Its minors migrate its schema too.
      pg-boss:
        patterns: ["pg-boss"]
      next:
        patterns: ["next", "@next/*"]
        update-types: [minor, patch]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
        update-types: [minor, patch]
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs"]
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "04:37"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/apps/web, /apps/worker]
    multi-ecosystem-group: container-images
    patterns: ["*"]
    cooldown:
      default-days: 7
    # Node's next major on a plan, before Gate 1 (docs/runbooks/dependency-upgrades.md).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    multi-ecosystem-group: container-images
    patterns: ["*"]
    cooldown:
      default-days: 7
    # PostgreSQL's next major on a plan (docs/runbooks/dependency-upgrades.md).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
