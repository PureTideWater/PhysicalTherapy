<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="background:#ffffff" viewBox="0 0 760 328" role="img" aria-label="A line moves forward through five stages and only the last one is money" font-size="11.5"><defs><marker id="tstatus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#111827">A line moves forward through five stages, and only the last one is money</text><text data-claude-text-id="subtitle" x="24" y="48" fill="#4b5563">Stages are monotonic; a reopen is an explicit action with a reason and an audit event</text><g data-claude-anchor="connectors" fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M152 124H168" marker-end="url(#tstatus-arrow)"></path><path d="M296 124H312" marker-end="url(#tstatus-arrow)"></path><path d="M440 124H456" marker-end="url(#tstatus-arrow)"></path><path d="M584 124H600" marker-end="url(#tstatus-arrow)"></path><path d="M664 152V172H376V160" marker-end="url(#tstatus-arrow)" stroke-dasharray="4 4"></path></g><g data-claude-anchor="flagged"><rect x="24" y="96" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="flagged" x="36" y="120" font-size="13" font-weight="600" fill="#111827">Flagged</text><text data-claude-text-id="flagged-a" x="36" y="138" fill="#4b5563">Screening signal</text></g><g data-claude-anchor="validated"><rect x="168" y="96" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="validated" x="180" y="120" font-size="13" font-weight="600" fill="#111827">Validated</text><text data-claude-text-id="validated-a" x="180" y="138" fill="#4b5563">Priced, traced</text></g><g data-claude-anchor="actionable"><rect x="312" y="96" width="128" height="56" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="actionable" x="324" y="120" font-size="13" font-weight="600" fill="#111827">Actionable</text><text data-claude-text-id="actionable-a" x="324" y="138" fill="#111827">Open, material</text></g><g data-claude-anchor="approved"><rect x="456" y="96" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="approved" x="468" y="120" font-size="13" font-weight="600" fill="#111827">Payer approved</text><text data-claude-text-id="approved-a" x="468" y="138" fill="#4b5563">Payer accepted</text></g><g data-claude-anchor="recovered"><rect x="600" y="96" width="128" height="56" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="recovered" x="612" y="120" font-size="13" font-weight="600" fill="#111827">Recovered</text><text data-claude-text-id="recovered-a" x="612" y="138" fill="#4b5563">Posted, net</text></g><text data-claude-text-id="recoup" x="520" y="186" text-anchor="middle" fill="#4b5563">recoupment or reversal reopens, with a negative entry</text><g data-claude-anchor="case-states"><line x1="24" y1="208" x2="736" y2="208" stroke="#cbd5e1"></line><text data-claude-text-id="case-title" x="24" y="232" font-weight="600" fill="#4b5563">Case states, derived from lines and submissions</text><rect x="24" y="246" width="712" height="40" rx="8" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="case-states" x="380" y="271" text-anchor="middle" fill="#111827">open → submitted → awaiting response → partially resolved → resolved, or closed written off (the only hand-set state)</text></g><text data-claude-text-id="headline" x="24" y="314" fill="#4b5563">Reports show actionable, payer approved and recovered as three numbers; flagged and validated sit below with their labels.</text></svg>