<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" style="background:#ffffff" viewBox="0 0 760 504" role="img" aria-label="Everything that touches PHI sits inside one AWS account under one business associate agreement" font-size="11.5"><defs><marker id="tarch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#111827">Everything that touches PHI sits inside one AWS account under one agreement</text><g data-claude-anchor="phi-boundary"><rect x="256" y="48" width="496" height="404" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="6 4"></rect><text data-claude-text-id="boundary" x="744" y="445" text-anchor="end" fill="#4b5563">PHI boundary: the AWS account, CDK-defined</text></g><g data-claude-anchor="connectors" fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M240 92H272" marker-end="url(#tarch-arrow)"></path><path d="M488 92H520" marker-end="url(#tarch-arrow)"></path><path d="M380 136V184" marker-end="url(#tarch-arrow)"></path><path d="M628 136V184" marker-end="url(#tarch-arrow)"></path><path d="M520 212H488" marker-end="url(#tarch-arrow)"></path><path d="M628 272V336" marker-end="url(#tarch-arrow)"></path><path d="M380 336V304" marker-end="url(#tarch-arrow)"></path></g><g data-claude-anchor="browser"><rect x="24" y="64" width="216" height="72" rx="8" fill="#f1f5f9" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="browser" x="36" y="88" font-size="13" font-weight="600" fill="#111827">Browser</text><text data-claude-text-id="browser-a" x="36" y="106" fill="#4b5563">Practice and firm users, MFA</text><text data-claude-text-id="browser-b" x="36" y="122" fill="#4b5563">Uploads straight to S3</text></g><g data-claude-anchor="web"><rect x="272" y="64" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="web" x="284" y="88" font-size="13" font-weight="600" fill="#111827">Web app (Next.js, Fargate)</text><text data-claude-text-id="web-a" x="284" y="106" fill="#4b5563">WAF, Cognito sessions</text><text data-claude-text-id="web-b" x="284" y="122" fill="#4b5563">Sets practice set per request</text></g><g data-claude-anchor="worker"><rect x="520" y="64" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="worker" x="532" y="88" font-size="13" font-weight="600" fill="#111827">Worker (Node, Fargate)</text><text data-claude-text-id="worker-a" x="532" y="106" fill="#4b5563">Parse, price, triage, reconcile</text><text data-claude-text-id="worker-b" x="532" y="122" fill="#4b5563">One practice per job</text></g><g data-claude-anchor="data-stores"><rect x="272" y="184" width="216" height="120" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="data" x="284" y="208" font-size="13" font-weight="600" fill="#111827">Postgres (RDS) and S3</text><text data-claude-text-id="data-a" x="284" y="226" fill="#111827">Forced row-level security</text><text data-claude-text-id="data-b" x="284" y="242" fill="#111827">Per-practice KMS data keys</text><text data-claude-text-id="data-c" x="284" y="258" fill="#111827">pg-boss queue, audit log</text><text data-claude-text-id="data-d" x="284" y="274" fill="#111827">Packets and audit copies locked</text><text data-claude-text-id="data-e" x="284" y="290" fill="#111827">Global rules read-only</text></g><g data-claude-anchor="gateway"><rect x="520" y="184" width="216" height="88" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="gateway" x="532" y="208" font-size="13" font-weight="600" fill="#111827">Model gateway</text><text data-claude-text-id="gateway-a" x="532" y="226" fill="#4b5563">Only module that calls a model</text><text data-claude-text-id="gateway-b" x="532" y="242" fill="#4b5563">Proposals verified by code</text><text data-claude-text-id="gateway-c" x="532" y="258" fill="#4b5563">Logs hashes, never text</text></g><g data-claude-anchor="aws-services"><rect x="520" y="336" width="216" height="88" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="aws" x="532" y="360" font-size="13" font-weight="600" fill="#111827">AWS services under the BAA</text><text data-claude-text-id="aws-a" x="532" y="378" fill="#4b5563">Bedrock via VPC endpoint</text><text data-claude-text-id="aws-b" x="532" y="394" fill="#4b5563">Textract, SES, KMS, Secrets</text><text data-claude-text-id="aws-c" x="532" y="410" fill="#4b5563">CloudTrail, GuardDuty, backups</text></g><g data-claude-anchor="content-and-ci"><rect x="272" y="336" width="216" height="88" rx="8" fill="none" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="content" x="284" y="360" font-size="13" font-weight="600" fill="#111827">Content releases (from CI)</text><text data-claude-text-id="content-a" x="284" y="378" fill="#4b5563">Medicare files, code lists</text><text data-claude-text-id="content-b" x="284" y="394" fill="#4b5563">Numbered, hashed, pinned by runs</text><text data-claude-text-id="content-c" x="284" y="410" fill="#4b5563">Loaded by the worker</text></g><g data-claude-anchor="outside"><rect x="24" y="184" width="216" height="88" rx="8" fill="#f1f5f9" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="outside" x="36" y="208" font-size="13" font-weight="600" fill="#111827">Outside the boundary</text><text data-claude-text-id="outside-a" x="36" y="226" fill="#4b5563">Stripe (no PHI), e-signature</text><text data-claude-text-id="outside-b" x="36" y="242" fill="#4b5563">GitHub and CI: synthetic only</text><text data-claude-text-id="outside-c" x="36" y="258" fill="#4b5563">Claude Code: code and twins</text></g><g data-claude-anchor="development"><rect x="24" y="336" width="216" height="88" rx="8" fill="#f1f5f9" fill-opacity="1" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="dev" x="36" y="360" font-size="13" font-weight="600" fill="#111827">Development</text><text data-claude-text-id="dev-a" x="36" y="378" fill="#4b5563">Local Postgres, files on disk</text><text data-claude-text-id="dev-b" x="36" y="394" fill="#4b5563">Synthetic fixtures, SYNTHSENDER</text><text data-claude-text-id="dev-c" x="36" y="410" fill="#4b5563">Never a real file</text></g><text data-claude-text-id="reads-writes" x="388" y="168" fill="#4b5563">reads and writes</text><text data-claude-text-id="jobs" x="636" y="168" fill="#4b5563">jobs and results</text><text data-claude-text-id="calls" x="636" y="304" fill="#4b5563">model calls</text><text data-claude-text-id="loads" x="388" y="324" fill="#4b5563">loaded by the worker</text><g data-claude-anchor="key"><rect x="24" y="474" width="12" height="12" rx="3" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.25"></rect><text data-claude-text-id="key-outside" x="44" y="484" fill="#4b5563">Outside the PHI boundary</text><rect x="220" y="474" width="12" height="12" rx="3" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"></rect><text data-claude-text-id="key-isolation" x="240" y="484" fill="#4b5563">Where tenant isolation is enforced</text></g></svg>