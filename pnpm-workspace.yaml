packages:
  - apps/*
  - packages/*
  - infra
  - tools

# One version of each shared tool across the workspace; packages refer to these as "catalog:".
catalog:
  "@types/node": ^24.19.2
  "@types/pg": ^8.23.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  decimal.js: ^10.6.0
  drizzle-orm: ^0.45.3
  fast-check: ^4.10.2
  pg: ^8.23.1
  react: ^19.3.1
  react-dom: ^19.3.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^5.0.4
  zod: ^4.6.7

# pnpm 10 runs no dependency lifecycle scripts unless they are listed here.
onlyBuiltDependencies:
  - esbuild

# A local fix to a dependency, applied at install (pnpm patch): @stryker-mutator/vitest-runner 10.0.0 named each test
# by its describe and test names joined by spaces, while Vitest 5 filters by its fullTestName (joined by " > "), so a
# mutant run selected no test and every covered mutant survived. The patch names a test by its fullTestName. Drop it
# when a release of the runner supports Vitest 5 (tools/stryker/canary checks it on every mutation run).
patchedDependencies:
  "@stryker-mutator/vitest-runner@10.0.0": patches/@stryker-mutator__vitest-runner@10.0.0.patch
