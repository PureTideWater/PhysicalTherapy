name: ci
on: [pull_request]

# A newer push to the same pull request cancels the older run, so superseded runs spend no minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    # A run takes 25 to 35 minutes; a hung step stops at 60 instead of GitHub's 360 (docs/adr/0063).
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The database logs every deliberate refusal the tests provoke; its log is printed after the job and,
      # unquieted, buries the failing test's own output. Only the database's log level changes.
      - run: psql postgres://postgres:test@localhost:5432/postgres -qc "ALTER SYSTEM SET log_min_messages = 'panic'" -qc "ALTER SYSTEM SET log_min_error_statement = 'panic'" -qc "SELECT pg_reload_conf()"
      - run: pnpm install --frozen-lockfile
      # Each approval of the domain model opens with what changed since the last approved one (docs/adr/0063): the
      # summary against the base branch, whose document is approved, in this job's summary. It reads no database.
      - name: Changes since the last approved domain model
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          if git cat-file -e "origin/$BASE_REF:docs/product/domain-model.md" 2>/dev/null; then
            pnpm -s db:domain-model --summary-since "origin/$BASE_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The base branch $BASE_REF holds no docs/product/domain-model.md; there is no approved document to compare with." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: pip install pyx12
      - run: pnpm audit --prod
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every table, interchange and workbook in the commit, read before anything regenerates the tree, through the
      # writer's own fixture guard: SYNTHSENDER in an identifier column, or a pinned table (CO-03, docs/adr/0059).
      - run: pnpm check:fixtures
      - run: pnpm typecheck && pnpm lint && pnpm lint:logs
      - run: pnpm verify-content
      - run: tools/check-releases-immutable.sh "origin/${{ github.base_ref }}"
      - run: pnpm synth --all
      # The generation is deterministic, so a committed fixture it rewrites, or a file it removes from a case or EMR
      # directory, is a fixture the commit holds that packages/synth did not write: the run fails on it.
      - run: git diff --exit-code -- fixtures/synthetic && test -z "$(git status --porcelain -- fixtures/synthetic)"
      # Playwright's own Chromium, the build the brand journey's pixel baselines were made with, and the one the
      # worker's tests print reports with: installed before the unit tests, so none of them skips (docs/adr/0058).
      - run: pnpm --filter @tp/web exec playwright install --with-deps chromium
      - run: pnpm test && pnpm test:golden && pnpm test:oracle
      - run: pnpm db:migrate && pnpm test:db
        env: { DATABASE_URL: postgres://postgres:test@localhost:5432/postgres }
      # The domain model's approval case (CO-02) fails in test:db until the founder signs the document;
      # the steps below still run and report, so the run shows every other check's result.
      - run: pnpm test:e2e
        if: ${{ !cancelled() }}
        env: { DATABASE_URL: postgres://postgres:test@localhost:5432/postgres }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            brand-screenshots/
          if-no-files-found: ignore
          # Up to 54 MB a run, against the private repository's 1 GB of Actions storage on GitHub Pro (docs/adr/0063).
          retention-days: 7
      # A failed run's screenshot comparisons, readable from the job's log alone: each diff and actual picture under
      # apps/web/test-results smaller than 300 KB, as its path and its base64 on one line (docs/adr/0058).
      - if: failure()
        run: |
          [ -d apps/web/test-results ] || exit 0
          find apps/web/test-results -type f \( -name '*-diff.png' -o -name '*-actual.png' \) -size -300k | sort | while IFS= read -r file; do
            echo "$file $(base64 -w 0 "$file")"
          done
      - run: pnpm build
        if: ${{ !cancelled() }}
      - run: pnpm cdk:diff
        if: ${{ !cancelled() }}
  mutation:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'money')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm stryker run
